function loadPublicRooms(){if(publicRoomsES){try{publicRoomsES.close();}catch(_){}}const cont=document.getElementById('publicRoomsList');if(cont)cont.innerHTML='<div class="pub-loading"><i class="fa-solid fa-spinner"></i>CARGANDO…</div>';publicRoomsES=new EventSource(COOP_SERVER+'/events/public-rooms');publicRoomsES.onmessage=function(e){try{const rooms=JSON.parse(e.data);const c=document.getElementById('publicRoomsList');if(!c)return;if(rooms.length===0){c.innerHTML='<div class="pub-empty">NO HAY SALAS PÚBLICAS</div>';return;}let html='';for(let i=0;i<rooms.length;i++){const r=rooms[i];const playersHtml=r.players.map(function(p){return '<span style="color:'+p.color+'">'+p.name+'</span>';}).join(' + ');html+='<button class="pub-room" data-room="'+r.id+'"><i class="fa-solid fa-door-open"></i><span style="flex:1">'+r.name+'</span><span style="color:#8aa4c4;font-size:10px">'+playersHtml+'</span></button>';}c.innerHTML=html;const btns=c.querySelectorAll('.pub-room');for(let j=0;j<btns.length;j++){(function(b){b.onclick=function(){joinPublicRoom(b.dataset.room);};})(btns[j]);}}catch(err){}};publicRoomsES.onerror=function(){const c=document.getElementById('publicRoomsList');if(c)c.innerHTML='<div class="pub-empty">ERROR DE CONEXIÓN</div>';};}

function updateWaitingRoomStatus(){const cs=document.getElementById('connStatus');const btn=document.getElementById('btnStartGame');const title=document.getElementById('waitTitle');if(!cs||!btn)return;renderPlayersList();if(coopPlayers.length>=2){if(title)title.textContent='SALA LISTA';cs.innerHTML='<div style="padding:10px;background:rgba(127,224,127,.08);border:2px solid #1e6a3a;border-radius:3px"><p style="font-size:11px;color:#9fe07f;letter-spacing:2px;margin:0"><i class="fa-solid fa-check"></i> JUGADORES LISTOS · PULSA INICIAR JUEGO</p></div>';btn.disabled=false;btn.style.opacity='1';btn.style.cursor='pointer';}else{if(title)title.textContent='ESPERANDO';cs.innerHTML='<div class="pub-loading"><i class="fa-solid fa-spinner"></i>ESPERANDO JUGADOR…</div>';btn.disabled=true;btn.style.opacity='.35';btn.style.cursor='not-allowed';}}

function showJoinRequest(name){const ex=document.getElementById('join-request-toast');if(ex)ex.remove();const d=document.createElement('div');d.id='join-request-toast';d.style.cssText='position:fixed;top:60px;right:12px;z-index:998;background:linear-gradient(180deg,#1a2e4a,#0a1428);border:2px solid #7fe0ff;padding:12px 14px;border-radius:4px;max-width:260px;box-shadow:0 4px 20px rgba(0,0,0,.6),0 0 20px rgba(127,224,255,.3)';d.innerHTML='<p style="margin:0 0 8px;color:#7fe0ff;font-size:12px;letter-spacing:1px;font-weight:bold"><i class="fa-solid fa-user-plus"></i> '+name+' QUIERE UNIRSE</p><div style="display:flex;gap:6px"><button id="btnApproveJoin" style="flex:1;padding:8px 6px;font-size:11px;background:linear-gradient(180deg,#7fe07f,#27ae60);border:2px solid #1a6a3a;color:#04121f;cursor:pointer;font-family:inherit;letter-spacing:1px;font-weight:bold">ACEPTAR</button><button id="btnRejectJoin" style="flex:1;padding:8px 6px;font-size:11px;background:linear-gradient(180deg,#ff9a9a,#c0392b);border:2px solid #7a1a10;color:#fff;cursor:pointer;font-family:inherit;letter-spacing:1px;font-weight:bold">RECHAZAR</button></div>';document.body.appendChild(d);document.getElementById('btnApproveJoin').onclick=()=>{if(coopSocket&&coopSocket.readyState===WebSocket.OPEN)try{coopSocket.send(JSON.stringify({type:'approve-join'}));}catch(_){}d.remove();};document.getElementById('btnRejectJoin').onclick=()=>{if(coopSocket&&coopSocket.readyState===WebSocket.OPEN)try{coopSocket.send(JSON.stringify({type:'reject-join'}));}catch(_){}d.remove();};}
function showCoopError(role,reason,detail){clearWsTimers();const detailTxt=detail?'<p style="font-size:11px;color:#dbe7ff;margin-top:4px;letter-spacing:1px;text-align:center">'+detail+'</p>':'';_coopStatusPanel({title:'ERROR',subtitle:reason,status:'<div style="text-align:center"><p style="font-size:20px;color:#ff3b5c;margin:0 0 6px"><i class="fa-solid fa-triangle-exclamation"></i></p>'+detailTxt+'</div>',buttons:[{id:'btnCoopRetry',label:'REINTENTAR',icon:'fa-rotate-right',cls:'btn-primary',onclick:()=>{wsRetries=0;clearWsTimers();showConnecting();setTimeout(()=>{connectCoop(role,coopPlayerName);},50);}},{id:'btnCoopMenuErr',label:'MENÚ COOP',icon:'fa-arrow-left',onclick:showCoop}]});}
function clearWsTimers(){if(wsConnectTimeout){clearTimeout(wsConnectTimeout);wsConnectTimeout=null;}if(wsRetryTimer){clearTimeout(wsRetryTimer);wsRetryTimer=null;}}
function connectCoop(role,name){if(publicRoomsES){try{publicRoomsES.close();}catch(_){}}publicRoomsES=null;coopRole=role;coopPlayerName=name;wsRetries=0;clearWsTimers();_doConnectCoop(role,name);}
async function _doConnectCoop(role,name){clearWsTimers();coopAwaitingJoined=true;setConnStatus('<div class="pub-loading"><i class="fa-solid fa-spinner"></i>CONECTANDO…</div>');try{const res=await fetch(COOP_SERVER+'/',{method:'GET',cache:'no-store'});if(!res.ok)throw new Error('bad');}catch(e){if(wsRetries<3){wsRetries++;setConnStatus('<div class="pub-loading"><i class="fa-solid fa-spinner"></i>REINTENTANDO ('+wsRetries+'/3)…</div>');wsRetryTimer=setTimeout(()=>_doConnectCoop(role,name),1500*wsRetries);return;}handleWsFailure(role,'network');return;}setConnStatus('<div class="pub-loading"><i class="fa-solid fa-spinner"></i>CONECTANDO…</div>');const wsUrl=COOP_SERVER.replace('https','wss')+'/ws?roomId='+coopRoomId+'&role='+role+'&name='+encodeURIComponent(name)+'&sessionId='+coopSessionId;let sock;try{sock=new WebSocket(wsUrl);}catch(e){handleWsFailure(role,'network');return;}coopSocket=sock;wsConnectTimeout=setTimeout(()=>{if(coopAwaitingJoined&&sock&&sock.readyState!==WebSocket.OPEN){try{sock.close();}catch(_){}}},12000);sock.onopen=()=>{if(wsConnectTimeout){clearTimeout(wsConnectTimeout);wsConnectTimeout=null;}setConnStatus('<div class="pub-loading" style="color:#7fe07f"><i class="fa-solid fa-check" style="animation:none;color:#7fe07f"></i>CONECTADO</div>');};sock.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='joined'){coopAwaitingJoined=false;coopPlayers=Array.isArray(m.players)?m.players:[];if(m.role==='guest'){isCoop=true;isHost=false;if(m.inGame){startCoopGame(false);}else{showGuestWaitingScreen();}}else{updateWaitingRoomStatus();}}else if(m.type==='player-joined'){coopPlayers=Array.isArray(m.players)?m.players:[];if(coopRole==='host'){if(G.state==='play'){levelSyncCount=3;if(P2.dead){P2.dead=false;P2.deadT=0;P2.hp=P2.maxHp;P2.invuln=2;P2.x=P.x+40;P2.y=GY-P2.h-20;P2.vx=0;P2.vy=0;}showToast('JUGADOR CONECTADO','#7fe0ff');}else{updateWaitingRoomStatus();}}else if(coopRole==='guest'&&G.state==='play'){showToast('HOST RECONECTADO','#7fe0ff');}}else if(m.type==='player-left'){coopPlayers=Array.isArray(m.players)?m.players:[];if(isHost){if(G.state==='play'){showToast('JUGADOR DESCONECTADO','#ff3b5c');}else{updateWaitingRoomStatus();}}else{if(G.state==='play'){showToast('HOST DESCONECTADO · ESPERANDO','#ff3b5c');}}}else if(m.type==='host-migrated'){isHost=true;coopRole='host';if(P2.dead){P2.dead=false;P2.deadT=0;P2.hp=P2.maxHp;P2.invuln=2;}showToast('AHORA ERES EL HOST','#ffe14a');levelSyncCount=3;}else if(m.type==='host-starting'&&coopRole==='guest'){startCoopGame(false);}else if(m.type==='pending-approval'){showPendingApproval();}else if(m.type==='join-request'){showJoinRequest(m.name||'JUGADOR');}else if(m.type==='pending-cancelled'){const el=document.getElementById('join-request-toast');if(el)el.remove();}else if(m.type==='state'&&coopRole==='guest'){if(!LV&&!levelRequested&&coopSocket&&coopSocket.readyState===WebSocket.OPEN){levelRequested=true;try{coopSocket.send(JSON.stringify({type:'request-level'}));}catch(_){}}applyRemoteState(m.data);}else if(m.type==='input'&&coopRole==='host'){p2inp=m.data;}else if(m.type==='request-level'&&coopRole==='host'){levelSyncCount=3;}else if(m.type==='guest-died'&&coopRole==='host'){if(!P2.dead){P2.dead=true;P2.hp=0;P2.deadT=0;respawnCoopItems();if(P.dead&&G.lives<0)showOver();}}}catch(err){console.error('coop msg error',err);}};sock.onerror=()=>{};sock.onclose=(ev)=>{if(wsConnectTimeout){clearTimeout(wsConnectTimeout);wsConnectTimeout=null;}if(coopAwaitingJoined){handleWsFailure(role,'close-before-join',ev);return;}if(ev.code===4090){showToast('NOMBRE DE JUGADOR YA EN USO','#ff3b5c');setTimeout(()=>showCoop(),2500);}else if(ev.code===4009){showToast('SALA LLENA','#ff3b5c');setTimeout(()=>showCoop(),2500);}else if(ev.code===4004){showToast('SALA NO ENCONTRADA','#ff3b5c');setTimeout(()=>showCoop(),2500);}else if(ev.code===4000){showToast('ERROR DE CONEXIÓN','#ff3b5c');}else if(G.state==='play'&&isCoop){showToast('CONEXIÓN PERDIDA','#ff3b5c');}};}
function handleWsFailure(role,kind,ev){clearWsTimers();let reason='NO SE PUDO CONECTAR';let detail='';if(kind==='close-before-join'){const code=ev&&ev.code;const clean=ev&&ev.wasClean;if(code===4090){reason='NOMBRE EN USO';detail='Ese nombre ya está siendo usado en la sala.';showCoopError(role,reason,detail);return;}if(code===4009){reason='SALA LLENA';detail='La sala ya tiene 2 jugadores.';showCoopError(role,reason,detail);return;}if(code===4004){reason='SALA NO ENCONTRADA';detail='La sala fue cerrada o no existe.';showCoopError(role,reason,detail);return;}if(!clean||code===1006){reason='SIN RESPUESTA DEL SERVIDOR';detail='Verifica tu conexión e inténtalo de nuevo.';}else{reason='CONEXIÓN RECHAZADA';detail='Código: '+code;}}else{reason='SIN CONEXIÓN AL SERVIDOR';detail='Verifica tu conexión e inténtalo de nuevo.';}if(wsRetries<3){wsRetries++;setConnStatus('<div class="pub-loading"><i class="fa-solid fa-spinner"></i>REINTENTANDO ('+wsRetries+'/3)…</div>');wsRetryTimer=setTimeout(()=>{_doConnectCoop(role,coopPlayerName);},1500*wsRetries);return;}showCoopError(role,reason,detail);}
function startCoopGame(host){if(host&&(coopPlayers.length<2||!coopPlayers.some(p=>p.role==='guest'))){showToast('ESPERANDO JUGADOR','#7fe0ff');return;}isCoop=true;isHost=host;G.state='play';hideOv();setMenuBg(false);if(host){G.level=1;G.lives=DIFF.dificil.lives;G.score=0;newLevel();}showToast('COOPERATIVO','#7fe0ff');}

beginPath();X.arc(x+5,h.y+5,3,0,6.283);X.fill();if(h.armed){const pulse=0.5+0.5*Math.sin(G.t*20);X.fillStyle='rgba(255,60,60,'+pulse+')';X.beginPath();X.arc(x+5,h.y-2,2,0,6.283);X.fill();}}}else if(h.type==='lance'){const cx=x+h.w/2,cy=h.y,grd=X.createLinearGradient(0,h.y+h.h,0,h.y);grd.addColorStop(0,'#8899aa');grd.addColorStop(1,'#e8f0ff');X.fillStyle=grd;X.beginPath();X.moveTo(x,h.y+h.h);X.lineTo(cx,h.y-2);X.lineTo(x+h.w,h.y+h.h);X.closePath();X.fill();X.fillStyle='rgba(0,0,0,.4)';X.beginPath();X.moveTo(cx,h.y-2);X.lineTo(x+h.w,h.y+h.h);X.lineTo(x+h.w*0.75,h.y+h.h);X.closePath();X.fill();X.fillStyle='rgba(255,240,160,.8)';X.beginPath();X.arc(cx,h.y,1.5,0,6.283);X.fill();}else if(h.type==='spikeCol'){X.fillStyle='#5a5a6a';X.fillRect(x,h.y,h.w,h.h);X.fillStyle='#8a8a9a';X.fillRect(x+1,h.y,h.w-2,1);X.fillStyle='#c0c8d8';X.beginPath();X.moveTo(x,h.y);X.lineTo(x+h.w/2,h.y-8);X.lineTo(x+h.w,h.y);X.closePath();X.fill();X.fillStyle='rgba(0,0,0,.4)';X.beginPath();X.moveTo(x+h.w/2,h.y-8);X.lineTo(x+h.w,h.y);X.lineTo(x+h.w*0.75,h.y);X.closePath();X.fill();X.fillStyle='rgba(255,255,255,.7)';X.fillRect(x+2,h.y+2,1,h.h-4);}else{const o=Math.sin(G.t*3)*2,grd=X.createLinearGradient(0,h.y+o,0,h.y+o+h.h);grd.addColorStop(0,'#ffe14a');grd.addColorStop(0.4,'#ff6a1a');grd.addColorStop(1,'#7a1000');X.fillStyle=grd;X.fillRect(x,h.y+o,h.w,h.h);X.fillStyle='rgba(255,220,120,.55)';for(let i=0;i<h.w;i+=14)X.fillRect(x+i,h.y+o+4+((i+G.t*30)%8),6,2);}}
function drawWorld(){for(const p of LV.plats){const x=Math.round(p.x-G.camX);if(x>W+40||x+p.w<-40)continue;drawPlatform(p,x);}for(const h of LV.haz)drawHazard(h);for(const d of DECALS){const x=Math.round(d.x-G.camX);if(x>W+40||x+d.w<-40)continue;X.fillStyle='rgba(20,20,20,'+(d.life/d.max*0.6)+')';X.beginPath();X.ellipse(x+d.w/2,d.y+d.h/2,d.w/2,d.h/2,0,0,6.283);X.fill();}for(const it of LV.items){const x=Math.round(it.x-G.camX),y=Math.round(it.y+Math.sin(it.t*3)*2);if(x>W+30||x<-30)continue;const col=colForType(it.type),cx=x+7,cy=y+7,grd=X.createRadialGradient(cx,cy,2,cx,cy,13);grd.addColorStop(0,col);grd.addColorStop(0.5,'rgba(10,20,40,.88)');grd.addColorStop(1,'rgba(10,20,40,0)');X.fillStyle=grd;X.beginPath();X.arc(cx,cy,13,0,6.283);X.fill();X.fillStyle='#0a1424';X.beginPath();X.arc(cx,cy,6,0,6.283);X.fill();X.strokeStyle=col;X.lineWidth=1;X.beginPath();X.arc(cx,cy,5.5,0,6.283);X.stroke();drawItemIcon(it.type,cx,cy,col);}for(const s of SKYITEMS){const sx=Math.round(s.x-G.camX),sy=Math.round(s.y);if(sx<-30||sx>W+30)continue;const col=colForType(s.type),grd=X.createRadialGradient(sx,sy,2,sx,sy,16);grd.addColorStop(0,col);grd.addColorStop(0.5,'rgba(10,20,40,.88)');grd.addColorStop(1,'rgba(10,20,40,0)');X.fillStyle=grd;X.beginPath();X.arc(sx,sy,16,0,6.283);X.fill();X.fillStyle='#0a1424';X.beginPath();X.arc(sx,sy,6,0,6.283);X.fill();X.strokeStyle=col;X.lineWidth=1.5;X.beginPath();X.arc(sx,sy,5.5,0,6.283);X.stroke();drawItemIcon(s.type,sx,sy,col);}if(G.nextPortal&&G.nextPortal.active){const px=Math.round(G.nextPortal.x-G.camX),py=G.nextPortal.y,pulse=Math.sin(G.t*4)*0.3+0.7,colGrd=X.createLinearGradient(px,py-80,px,GY);colGrd.addColorStop(0,'rgba(127,224,255,0)');colGrd.addColorStop(0.3,'rgba(127,224,255,'+(pulse*0.28)+')');colGrd.addColorStop(1,'rgba(127,224,255,'+(pulse*0.5)+')');X.fillStyle=colGrd;X.fillRect(px-20,py-80,40,GY-py+80);for(let i=0;i<4;i++){const ringR=(G.t*35+i*15)%70,alpha=1-ringR/70;X.strokeStyle='rgba(200,240,255,'+(alpha*0.65)+')';X.lineWidth=2;X.beginPath();X.arc(px,py,ringR,0,6.283);X.stroke();}const grd=X.createRadialGradient(px,py,0,px,py,24*pulse);grd.addColorStop(0,'rgba(255,255,255,.95)');grd.addColorStop(0.4,'rgba(127,224,255,.6)');grd.addColorStop(1,'rgba(127,224,255,0)');X.fillStyle=grd;X.beginPath();X.arc(px,py,24*pulse,0,6.283);X.fill();for(let i=0;i<8;i++){const ang=G.t*2.2+i*Math.PI/4,dist=20+Math.sin(G.t*3+i)*6;X.fillStyle='rgba(200,240,255,'+(0.5+Math.sin(G.t*4+i)*0.3)+')';X.fillRect(px+Math.cos(ang)*dist-1,py+Math.sin(ang)*dist-1,2,2);}}}
function drawItemIcon(type,cx,cy,col){X.save();X.textAlign='center';X.textBaseline='middle';X.font='900 7px "Font Awesome 6 Free"';X.fillStyle=col;X.fillText(FA_ICONS[type]||'\uf005',cx,cy);X.restore();}
function drawBossSprite(e){const x=Math.round(e.x-G.camX),y=Math.round(e.y),w=e.w,h=e.h;if(x>W+120||x+w<-120)return;const fl=e.hitT>0;const ac={redGuardian:[255,59,92],greenTitan:[127,224,127],waspQueen:[255,225,74],droneOverlord:[57,208,255],purpleAlien:[169,123,255],jellySpecter:[169,123,255],mechCannon:[57,208,255],redGreenFusion:[255,107,74],purpleJellyFusion:[169,123,255],robotDroneFusion:[57,208,255]}[e.bossType]||[255,225,74];const cx=x+w/2,cy=y+h/2,pulse=0.75+Math.sin(G.t*2.5+e.t)*0.25,R=Math.max(w,h)*0.85*pulse;const ag=X.createRadialGradient(cx,cy,R*0.3,cx,cy,R);ag.addColorStop(0,'rgba('+ac[0]+','+ac[1]+','+ac[2]+',0.45)');ag.addColorStop(0.6,'rgba('+ac[0]+','+ac[1]+','+ac[2]+',0.12)');ag.addColorStop(1,'rgba('+ac[0]+','+ac[1]+','+ac[2]+',0)');X.fillStyle=ag;X.beginPath();X.arc(cx,cy,R,0,6.283);X.fill();const rt=(G.t*0.8)%1;X.strokeStyle='rgba('+ac[0]+','+ac[1]+','+ac[2]+','+(0.35*(1-rt))+')';X.lineWidth=2;X.beginPath();X.arc(cx,cy,R*(0.6+rt*0.5),0,6.283);X.stroke();for(let i=0;i<4;i++){const aa=G.t*0.6+i*Math.PI/2,dd=R*0.75,px=cx+Math.cos(aa)*dd,py=cy+Math.sin(aa)*dd;X.fillStyle='rgba('+ac[0]+','+ac[1]+','+ac[2]+','+(0.5+Math.sin(G.t*4+i)*0.3)+')';X.fillRect(px-1.5,py-1.5,3,3);}X.save();X.translate(x,y);const bw=e.baseW||14,bh=e.baseH||14,sc=w/bw;X.scale(sc,sc);if(e.face<0){X.translate(bw,0);X.scale(-1,1);}const tempE={type:e.baseType||'walk',x:0,y:0,w:bw,h:bh,face:1,t:e.t,hitT:0,fuse:0,mode:'approach',tint:null,anim:e.t*5,treadAnim:e.t*5,cd:e.cd,rayT:0,isBoss:true,isFinal:e.isFinal,bossType:e.bossType};drawEnemyVisual(tempE,0,0,sc);const bt2=e.bossType||'redGuardian';if(bt2==='redGuardian'){X.fillStyle='#ffb300';X.fillRect(2,0,10,2);if(e.isFinal){X.fillStyle='#ffe14a';X.beginPath();X.moveTo(2,-6);X.lineTo(3,-2);X.lineTo(7,-7);X.lineTo(11,-2);X.lineTo(12,-6);X.lineTo(12,0);X.lineTo(2,0);X.closePath();X.fill();}X.fillStyle='#0a0a15';X.fillRect(3,6,3,3);X.fillRect(8,6,3,3);X.fillStyle='#ffe14a';X.fillRect(4,7,1,1);X.fillRect(9,7,1,1);}else if(bt2==='waspQueen'){X.fillStyle='#ffe14a';X.fillRect(3,-9,1,9);X.fillRect(10,-9,1,9);X.fillStyle='#ff3b5c';X.fillRect(2,-10,3,2);X.fillRect(9,-10,3,2);X.fillStyle='#ff6b4a';X.fillRect(6,-3,2,2);}else if(bt2==='droneOverlord'){X.fillStyle='#ffb300';X.fillRect(2,0,10,2);X.fillStyle='#39d0ff';for(let i=0;i<5;i++){const hh=(i%2===0)?4:2;X.fillRect(2+i*2,-hh,1,hh);}X.fillStyle='#7fe0ff';X.fillRect(3,-1,8,1);}else if(bt2==='purpleAlien'){X.fillStyle='#a97bff';X.beginPath();X.arc(4,4,2,0,6.283);X.arc(10,4,2,0,6.283);X.arc(7,7,2.5,0,6.283);X.fill();X.fillStyle='#ffe14a';X.beginPath();X.arc(4,4,1,0,6.283);X.arc(10,4,1,0,6.283);X.arc(7,7,1.3,0,6.283);X.fill();}else if(bt2==='jellySpecter'){X.fillStyle='#a97bff';X.fillRect(2,-7,2,4);X.fillRect(6,-8,2,5);X.fillRect(10,-6,2,3);X.fillStyle='#7fe0ff';X.fillRect(3,-6,1,1);X.fillRect(7,-7,1,1);}else if(bt2==='mechCannon'){X.fillStyle='#ffb300';X.fillRect(2,0,10,2);X.fillStyle='#ff8a3c';X.fillRect(5,-3,4,3);X.fillStyle='#ffe14a';X.fillRect(6,-2,2,1);}else if(bt2==='redGreenFusion'){X.fillStyle='#ffb300';X.fillRect(2,0,10,2);X.fillStyle='#ff6b4a';X.beginPath();X.moveTo(2,-6);X.lineTo(3,-2);X.lineTo(6,-5);X.closePath();X.fill();X.fillStyle='#7fe07f';X.beginPath();X.moveTo(7,-6);X.lineTo(8,-2);X.lineTo(12,-6);X.closePath();X.fill();X.fillStyle='#ffe14a';X.beginPath();X.arc(7,5,3,0,6.283);X.fill();}else if(bt2==='purpleJellyFusion'){X.fillStyle='#a97bff';X.beginPath();X.arc(4,3,2.2,0,6.283);X.arc(10,3,2.2,0,6.283);X.fill();X.fillStyle='#d8b4ff';X.beginPath();X.arc(4,3,1.2,0,6.283);X.arc(10,3,1.2,0,6.283);X.fill();X.fillStyle='#7fe0ff';X.beginPath();X.arc(7,8,2,0,6.283);X.fill();}else if(bt2==='robotDroneFusion'){X.fillStyle='#ffb300';X.fillRect(2,0,10,2);X.fillStyle='#39d0ff';for(let i=0;i<5;i++){const hh=(i%2===0)?3:1;X.fillRect(2+i*2,-hh,1,hh);}X.fillStyle='#ff8a3c';X.beginPath();X.arc(7,4,2.5,0,6.283);X.fill();X.fillStyle='#ffe14a';X.beginPath();X.arc(7,4,1.2,0,6.283);X.fill();}if(fl){const hg=X.createRadialGradient(bw/2,bh/2,1,bw/2,bh/2,bw*0.9);hg. );X.fill();X.fillStyle='#ff6b4a';X.beginPath();X.arc(bx,by,2.5,0,6.283);X.fill();X.fillStyle='#ffe14a';X.fillRect(bx-1,by-7,2,3);}}for(const m of MT){const mx=Math.round(m.x-G.camX),my=Math.round(m.y);if(m.rock){const s=m.size||4;X.fillStyle='#4a4a5a';X.fillRect(mx-s/2,my-s/2,s,s);X.fillStyle='#7a7a8a';X.fillRect(mx-s/2+1,my-s/2+1,s-2,2);}else{const trailGrd=X.createLinearGradient(mx,my-20,mx,my);trailGrd.addColorStop(0,'rgba(255,60,20,0)');trailGrd.addColorStop(1,'rgba(255,180,60,.6)');X.fillStyle=trailGrd;X.beginPath();X.moveTo(mx-3,my-20);X.lineTo(mx+3,my-20);X.lineTo(mx+2,my);X.lineTo(mx-2,my);X.closePath();X.fill();const grd=X.createRadialGradient(mx,my,0,mx,my,11);grd.addColorStop(0,'#ffe14a');grd.addColorStop(0.4,'#ff8a3c');grd.addColorStop(1,'rgba(255,120,60,0)');X.fillStyle=grd;X.beginPath();X.arc(mx,my,11,0,6.283);X.fill();X.fillStyle='#ffe14a';X.beginPath();X.arc(mx,my,3,0,6.283);X.fill();}}for(const f of FB){const fx=Math.round(f.x-G.camX),fy=Math.round(f.y),grd=X.createRadialGradient(fx,fy,0,fx,fy,f.r*3);grd.addColorStop(0,'#fff2a0');grd.addColorStop(0.25,'#ffe14a');grd.addColorStop(0.55,'#ff8a3c');grd.addColorStop(1,'rgba(255,60,20,0)');X.fillStyle=grd;X.beginPath();X.arc(fx,fy,f.r*3,0,6.283);X.fill();X.fillStyle='#fff2a0';X.beginPath();X.arc(fx,fy,f.r*0.5,0,6.283);X.fill();}}
function heart(x,y,on){X.fillStyle=on?'#ff3b5c':'#2a1620';X.fillRect(x+1,y,2,1);X.fillRect(x+4,y,2,1);X.fillRect(x,y+1,7,2);X.fillRect(x+1,y+3,5,1);X.fillRect(x+2,y+4,3,1);X.fillRect(x+3,y+5,1,1);}
function drawHud(){if(!LV)return;X.textBaseline='top';X.font='bold 11px monospace';for(let i=0;i<P.maxHp;i++)heart(8+i*9,8,i<P.hp);X.fillStyle='#9fd6ff';X.fillText('x'+Math.max(0,G.lives),10+P.maxHp*9,9);X.textAlign='center';X.font='bold 16px monospace';X.fillStyle='#ffe14a';X.fillText(G.score,W/2,7);X.font='bold 8px monospace';X.fillStyle='#8a8a9a';X.fillText('PUNTOS',W/2,26);X.textAlign='right';X.font='bold 10px monospace';X.fillStyle=DIFF_COLOR[CFG.difficulty]||'#7fe0ff';X.fillText('NIVEL '+G.level,W-8,9);X.fillStyle='#a97bff';X.fillText((isCoop?'DIFÍCIL':CFG.difficulty.toUpperCase()),W-8,20);X.textAlign='center';X.font='bold 12px monospace';X.fillStyle='rgba(0,0,0,.55)';X.fillRect(W/2-35,H-26,70,12);X.fillStyle='rgba(200,230,255,.95)';X.fillText(curBiome().name,W/2,H-25);X.textAlign='left';const wn=P.weapon==='spread'?'TRIPLE':P.weapon==='laser'?'LÁSER':'NORMAL';X.font='italic bold 11px "Courier New",monospace';X.fillStyle='rgba(0,0,0,.55)';X.fillRect(4,H-19,90,14);X.fillStyle=P.weapon==='spread'?'#ff9f43':P.weapon==='laser'?'#7ff0ff':'#d8e0ec';X.fillText('✦ '+wn+(P.rapidT>0?' +RAPID':''),8,H-17);if(P.shield>0){X.font='bold 12px monospace';X.fillStyle='rgba(0,0,0,.55)';X.fillRect(4,H-35,80,14);X.fillStyle='#7fe0ff';X.fillText('ESCUDO '+Math.ceil(P.shield),8,H-33);}if(P.slowT>0){X.font='bold 11px monospace';X.fillStyle='rgba(0,0,0,.55)';X.fillRect(4,H-49,72,12);X.fillStyle='#a97bff';X.fillText('LENTO '+Math.ceil(P.slowT),8,H-47);}if(G.flashT>0){X.globalAlpha=Math.min(0.6,G.flashT*1.5);X.fillStyle=G.flashColor;X.fillRect(0,0,W,H);X.globalAlpha=1;}if(G.msgT>0){X.textAlign='center';X.font='bold 11px monospace';X.globalAlpha=Math.min(1,G.msgT);const tw=X.measureText(G.msg).width;X.fillStyle='rgba(0,0,0,.82)';X.fillRect(W/2-tw/2-8,36,tw+16,16);X.strokeStyle=G.msgC;X.lineWidth=1;X.strokeRect(W/2-tw/2-8.5,36.5,tw+17,15);X.fillStyle=G.msgC;X.fillText(G.msg,W/2,38);X.globalAlpha=1;X.textAlign='left';}const boss=(LV.finalBoss&&!LV.finalBoss.dead)?LV.finalBoss:(LV.boss&&!LV.boss.dead?LV.boss:null);if(boss){const bx1=boss.x-G.camX,bx2=bx1+boss.w;if(bx1>-20&&bx2<W+20){const cx=clamp((bx1+bx2)/2,80,W-80),cy=Math.max(40,boss.y-50),bn=boss.bossName||'JEFE';X.globalAlpha=0.95;X.textAlign='center';X.font='bold 12px monospace';const tw=X.measureText(bn).width;X.fillStyle='rgba(0,0,0,.6)';X.fillRect(cx-tw/2-6,cy-14,tw+12,16);X.fillStyle=boss.isFinal?'#ff3b5c':'#7fe0ff';X.fillText(bn,cx,cy-12);const bw=140,hpPct=Math.max(0,boss.hp/boss.maxHp);if(boss.isFinal&&boss.maxArmor){const armPct=Math.max(0,boss.armor/boss.maxArmor);X.fillStyle='rgba(0,0,0,.6)';X.fillRect(cx-bw/2,cy+2,bw,4);X.fillStyle='#7fe0ff';X.fillRect(cx-bw/2,cy+2,bw*armPct,4);X.fillStyle='rgba(0,0,0,.6)';X.fillRect(cx-bw/2,cy+8,bw,4);X.fillStyle='#ff3b5c';X.fillRect(cx-bw/2,cy+8,bw*hpPct,4);}else{X.fillStyle='rgba(0,0,0,.6)';X.fillRect(cx-bw/2,cy+4,bw,4);X.fillStyle='#ff3b5c';X.fillRect(cx-bw/2,cy+4,bw*hpPct,4);}X.globalAlpha=1;X.textAlign='left';}}}
function drawDarkOverlay(){if(G.fx.dark<=0)return;const a=Math.min(0.75,G.fx.dark/7),px=P.x-G.camX+6,py=P.y+8,radius=95+Math.sin(G.t*2)*8,grd=X.createRadialGradient(px,py,radius*0.4,px,py,radius*1.6);grd.addColorStop(0,'rgba(0,0,10,0)');grd.addColorStop(0.5,'rgba(5,0,20,'+(a*0.55)+')');grd.addColorStop(1,'rgba(0,0,8,'+(a*0.92)+')');X.fillStyle=grd;X.fillRect(0,0,W,H);}
function render(){X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.fillStyle='#04050a';X.fillRect(0,0,W,H);X.textBaseline='top';let sx=0,sy=0;if(G.shake>0){sx=rnd(-G.shake,G.shake)*0.5;sy=rnd(-G.shake,G.shake)*0.5;}X.save();X.translate(Math.round(sx),Math.round(sy));drawBg();if(LV){drawEventFX();drawWeather();drawWorld();for(const e of LV.ens)if(!e.dead)drawEnemy(e);drawPlayer();if(isCoop&&coopPlayers.length>=2&&coopPlayers.some(p=>p.role==='guest'))drawPlayer2();drawBullets();drawPT();if(G.bossDeathFX>0){const t=1-G.bossDeathFX/1.5,px=G.bossDeathX-G.camX,py=G.bossDeathY,cols=G.bossDeathColors||['#ffe14a','#ff8a3c','#ff3b5c'];X.save();X.globalCompositeOperation='lighter';for(let i=0;i<4;i++){X.globalAlpha=Math.max(0,(1-t)*(0.65-i*0.13));X.strokeStyle=cols[i%cols.length];X.lineWidth=3-t*2;const r=t*(180+i*70);X.beginPath();X.arc(px,py,r,0,6.283);X.stroke();}const grd=X.createRadialGradient(px,py,0,px,py,120*t+1);grd.addColorStop(0,'rgba(255,240,160,'+(1-t)*0.65+')');grd.addColorStop(0.5,'rgba(255,120,50,'+(1-t)*0.3+')');grd.addColorStop(1,'rgba(255,50,20,0)');X.globalAlpha=1;X.fillStyle=grd;X.beginPath();X.arc(px,py,120*t+1,0,6.283);X.fill();X.restore();}drawDarkOverlay();if(G.state==='teleporting'){const t=1-G.teleportT/0.8;X.strokeStyle='rgba(127,224,255,'+(1-t)+')';X.lineWidth=4*(1-t)+1;for(let i=0;i<5;i++){const r=t*220+i*35;X.beginPath();X.arc(P.x-G.camX+6,P.y+8,r,0,6.283);X.stroke();}X.fillStyle='rgba(240,250,255,'+(t*0.7)+')';X.fillRect(0,0,W,H);}}X.restore();drawHud();if(isCoop&&P.dead){X.fillStyle='rgba(0,0,0,0.85)';X.fillRect(0,0,W,H);X.textAlign='center';X.font='bold 24px monospace';X.fillStyle='#ff3b5c';X.fillText('HAS MUERTO',W/2,H/2-20);X.font='bold 12px monospace';X.fillStyle='#8aa4c4';X.fillText('ESPERANDO PARA REAPARECER',W/2,H/2+10);X.fillText('PRESIONA UNA TECLA O TOCA',W/2,H/2+28);X.textAlign='left';}const vg=X.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.35)');X.fillStyle=vg;X.fillRect(0,0,W,H);}
let last=0;const _tbBtns=Array.from(document.querySelectorAll('.tb'));
function _anyTBOn(){for(const b of _tbBtns){if(b.classList.contains('on'))return true;}return false;}
let _pauseIdleT=0,_pauseShown=false;const _PAUSE_GRACE=1.5;
function updatePauseBtn(){const b=document.getElementById('btnPause');if(!b)return;if(!(IS_TOUCH&&G.state==='play')){_pauseIdleT=0;if(_pauseShown){b.classList.remove('show');_pauseShown=false;}return;}if(_anyTBOn()){_pauseIdleT=0;if(_pauseShown){b.classList.remove('show');_pauseShown=false;}return;}_pauseIdleT+=1/60;if(_pauseIdleT>=_PAUSE_GRACE&&!_pauseShown){b.classList.add('show');_pauseShown=true;}}
function loop(ts){requestAnimationFrame(loop);if(!last)last=ts;let dtReal=(ts-last)/1000;last=ts;if(dtReal>0.05)dtReal=0.05;let dt=dtReal;if(G.slowmo>0){G.slowmo=Math.max(0,G.slowmo-dtReal);dt*=0.25;}if(G.bossDeathFX>0)G.bossDeathFX=Math.max(0,G.bossDeathFX-dtReal);if(G.state==='play'||G.state==='bossDefeat'||G.state==='teleporting')update(dt);else G.t+=dt;updatePauseBtn();render();}
document.fonts.ready.then(()=>{render();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play'&&!isCoop)togglePause();});
window.addEventListener('blur',()=>{if(G.state==='play'&&!isCoop)togglePause();});
const MBG=document.getElementById('menuBg'),MBX=MBG.getContext('2d');let mbMet=[],mbStar=[],mbLast=0,mbOn=false,mbResizeT=0;
function mbResize(){const r=document.getElementById('app').getBoundingClientRect();MBG.width=Math.max(320,r.width||innerWidth);MBG.height=Math.max(240,r.height||innerHeight);mbStar=[];for(let i=0;i<60;i++)mbStar.push({x:Math.random()*MBG.width,y:Math.random()*MBG.height*0.7,s:Math.random()<0.2?2:1,tw:Math.random()*6.28});}
addEventListener('resize',()=>{if(mbOn){clearTimeout(mbResizeT);mbResizeT=setTimeout(mbResize,120);}});
let mbGiantT=0;function mbSpawn(dt){const w=MBG.width,h=MBG.height;mbGiantT-=dt;if(mbMet.length<6&&Math.random()<0.06){mbMet.push({x:Math.random()*w*0.9-w*0.1,y:-20,vx:(Math.random()-0.5)*80+40,vy:180+Math.random()*180,size:2+Math.random()*3,trail:[]});}if(Math.random()<0.02&&mbMet.length<8){mbMet.push({x:Math.random()*w*0.9-w*0.1,y:-20,vx:(Math.random()-0.5)*50-30,vy:220+Math.random()*160,size:1.5+Math.random()*2,trail:[]});}if(mbGiantT<=0){mbGiantT=15+Math.random()*10;mbMet.push({x:Math.random()*w*0.8-w*0.2,y:-50,vx:rnd(-40,40),vy:rnd(250,350),size:8+Math.random()*6,trail:[],giant:true});}}
function mbDraw(dt){if(!mbOn)return;const w=MBG.width,h=MBG.height;MBX.clearRect(0,0,w,h);const g=MBX.createLinearGradient(0,0,0,h);g.addColorStop(0,'#050a18');g.addColorStop(0.55,'#08142a');g.addColorStop(1,'#04050a');MBX.fillStyle=g;MBX.fillRect(0,0,w,h);for(const s of mbStar){s.tw+=dt*2;const a=0.3+0.5*(Math.sin(s.tw)*0.5+0.5);MBX.fillStyle='rgba(180,220,255,'+a+')';MBX.fillRect(s.x,s.y,s.s,s.s);}mbSpawn(dt);for(let i=mbMet.length-1;i>=0;i--){const m=mbMet[i];m.trail.push({x:m.x,y:m.y});if(m.trail.length>(m.giant?20:10))m.trail.shift();m.x+=m.vx*dt;m.y+=m.vy*dt;MBX.save();MBX.globalCompositeOperation='lighter';for(let j=0;j<m.trail.length;j++){const t=m.trail[j],k=j/m.trail.length;if(m.giant){const grd=MBX.createRadialGradient(t.x,t.y,0,t.x,t.y,m.size*(1-k*0.8));grd.addColorStop(0,'rgba(255,240,160,'+(k*0.8)+')');grd.addColorStop(0.5,'rgba(255,120,20,'+(k*0.5)+')');grd.addColorStop(1,'rgba(255,40,10,0)');MBX.fillStyle=grd;MBX.beginPath();MBX.arc(t.x,t.y,m.size*(1.5-k*1.2),0,6.283);MBX.fill();}else{MBX.fillStyle='rgba(255,'+Math.round(100+80*k)+',40,'+(k*0.55)+')';MBX.beginPath();MBX.arc(t.x,t.y,m.size*(0.3+k*0.9),0,6.283);MBX.fill();}}const headG=MBX.createRadialGradient(m.x,m.y,0,m.x,m.y,m.size*(m.giant?12:7));headG.addColorStop(0,'rgba(255,240,160,1)');headG.addColorStop(0.2,'rgba(255,200,60,1)');headG.addColorStop(0.5,'rgba(255,100,20,.8)');headG.addColorStop(1,'rgba(255,20,0,0)');MBX.fillStyle=headG;MBX.beginPath();MBX.arc(m.x,m.y,m.size*(m.giant?12:7),0,6.283);MBX.fill();MBX.fillStyle='#fff2a0';MBX.beginPath();MBX.arc(m.x,m.y,m.size*(m.giant?0.8:0.5),0,6.283);MBX.fill();MBX.restore();if(m.y>h+60||m.x<-80||m.x>w+80)mbMet.splice(i,1);}MBX.fillStyle='rgba(4,5,10,.15)';MBX.fillRect(0,0,w,h);}
function mbLoop(ts){requestAnimationFrame(mbLoop);if(!mbOn)return;if(!mbLast)mbLast=ts;let dt=(ts-mbLast)/1000;mbLast=ts;if(dt>0.05)dt=0.05;mbDraw(dt);}
function setMenuBg(on){mbOn=on;if(on){mbResize();MBG.classList.add('on');}else MBG.classList.remove('on');}
menu();requestAnimationFrame(loop);requestAnimationFrame(mbLoop);
const _urlRoom=new URL(location.href).searchParams.get('room');if(_urlRoom&&_urlRoom.length===6){setTimeout(()=>{showCoop();setTimeout(()=>{const jc=document.getElementById('joinCode');if(jc){jc.value=_urlRoom;joinRoomByCode();}},400);},250);}
