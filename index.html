function drawLandscape(idx,layer,speed,color){const off=G.camX*speed;X.fillStyle=color;if(idx===0){const baseY=layer===0?180:200;const cnt=layer===0?6:8;for(let i=0;i<cnt;i++){const mx=((i*200-off)%(cnt*200)+cnt*200)%(cnt*200)-200;X.beginPath();X.moveTo(mx,GY);X.quadraticCurveTo(mx+60,baseY-20,mx+100,baseY);X.quadraticCurveTo(mx+140,baseY-20,mx+200,GY);X.closePath();X.fill();}if(layer===1){for(let i=0;i<10;i++){const mx=((i*180-off)%1800+1800)%1800-180;X.fillRect(mx+8,180,4,36);X.beginPath();X.arc(mx+10,175,12,0,6.283);X.fill();}}}else if(idx===1){for(let i=0;i<8;i++){const mx=((i*160-off)%1280+1280)%1280-160;X.beginPath();X.moveTo(mx,GY);X.quadraticCurveTo(mx+40,170+(layer===0?20:0),mx+80,GY);X.quadraticCurveTo(mx+120,170+(layer===0?20:0),mx+160,GY);X.closePath();X.fill();}if(layer===0){for(let i=0;i<3;i++){const mx=((i*400-off)%1200+1200)%1200-400;X.beginPath();X.moveTo(mx+60,GY);X.lineTo(mx+120,120);X.lineTo(mx+180,GY);X.closePath();X.fill();}}}else if(idx===2){for(let i=0;i<8;i++){const mx=((i*180-off)%1440+1440)%1440-180;X.beginPath();X.moveTo(mx,GY);X.lineTo(mx+90,100-(layer===1?20:0));X.lineTo(mx+180,GY);X.closePath();X.fill();if(layer===1){X.fillStyle='rgba(255,255,255,.4)';X.beginPath();X.moveTo(mx+90,100);X.lineTo(mx+75,130);X.lineTo(mx+85,128);X.lineTo(mx+90,135);X.lineTo(mx+95,128);X.lineTo(mx+105,130);X.closePath();X.fill();X.fillStyle=color;}}}else if(idx===3){if(layer===0){for(let i=0;i<3;i++){const mx=((i*400-off)%1200+1200)%1200-400;X.beginPath();X.moveTo(mx,GY);X.lineTo(mx+150,70);X.lineTo(mx+300,GY);X.closePath();X.fill();X.fillStyle='rgba(255,120,40,.6)';X.beginPath();X.moveTo(mx+138,82);X.lineTo(mx+162,82);X.lineTo(mx+150,98);X.closePath();X.fill();X.fillStyle=color;}}for(let i=0;i<8;i++){const mx=((i*180-off)%1440+1440)%1440-180;X.beginPath();X.moveTo(mx,GY);X.lineTo(mx+90,160-(layer===0?10:0));X.lineTo(mx+180,GY);X.closePath();X.fill();}}else if(idx===4){for(let i=0;i<8;i++){const mx=((i*160-off)%1280+1280)%1280-160;X.beginPath();X.moveTo(mx,GY);X.quadraticCurveTo(mx+80,170,mx+160,GY);X.closePath();X.fill();}}else{for(let i=0;i<6;i++){const mx=((i*200-off)%1200+1200)%1200-200;const my=130+Math.sin(G.t+i)*10;X.beginPath();X.moveTo(mx,my);X.lineTo(mx+40,my-20);X.lineTo(mx+80,my);X.lineTo(mx+40,my+20);X.closePath();X.fill();}for(let i=0;i<5;i++){const mx=((i*220-off)%1100+1100)%1100-220;X.beginPath();X.moveTo(mx,GY);X.lineTo(mx+20,100);X.lineTo(mx+40,GY);X.closePath();X.fill();}}}
function drawBg(){const blend=getBlend();const b=blend.biome;const prev=blend.prev||b;const t=blend.t;const idx=curBiomeIdx();const sky1=mixCol(prev.sky1,b.sky1,t);const sky2=mixCol(prev.sky2,b.sky2,t);const m2=mixCol(prev.m2,b.m2,t);const m1=mixCol(prev.m1,b.m1,t);const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,sky1);g.addColorStop(0.55,sky2);g.addColorStop(1,m2);X.fillStyle=g;X.fillRect(0,0,W,H);drawCelestial(idx);if(b.weather==='stars'){for(let i=0;i<30;i++){const sx=((i*97.3-G.camX*0.12)%(W+40)+W+40)%(W+40)-20;const sy=(i*53)%160;const tw=Math.sin(G.t*2+i)*0.5+0.5;const grd=X.createRadialGradient(sx,sy,0,sx,sy,2.5);grd.addColorStop(0,'rgba(220,235,255,'+(0.4+tw*0.6)+')');grd.addColorStop(1,'rgba(180,220,255,0)');X.fillStyle=grd;X.beginPath();X.arc(sx,sy,2.5,0,6.283);X.fill();}}drawLandscape(idx,0,0.28,m1);drawLandscape(idx,1,0.5,m2);X.fillStyle=m2;X.fillRect(0,GY-1,W,H-GY+1);if(b.tint){X.fillStyle=b.tint;X.fillRect(0,0,W,H);}if(G.lightningT>0){X.fillStyle='rgba(240,250,255,'+Math.min(0.9,G.lightningT*4)+')';X.fillRect(0,0,W,H);}}
function drawWeather(){const b=curBiome();for(const p of WP){X.globalAlpha=Math.min(1,p.life)*0.75;X.fillStyle=p.c;const px=Math.round(p.x-G.camX),py=Math.round(p.y);if(b.weather==='rain'){X.fillRect(px,py,1,6);}else if(b.weather==='snow'){X.fillRect(px,py,2,2);}else if(b.weather==='sand'){X.fillRect(px,py,4,1);}else{X.fillRect(px,py,1,1);X.fillStyle='rgba(255,120,60,.3)';X.fillRect(px-1,py-1,3,3);}}X.globalAlpha=1;}
function drawGroundForm(p,x,b){const form=p.form||'path';const top=p.y,hh=p.h,ww=p.w;X.fillStyle='#0a1830';X.fillRect(x,top,ww,hh);if(form==='path'){X.fillStyle=b.g1;X.fillRect(x,top,ww,5);X.fillStyle=b.g2;X.fillRect(x,top+5,ww,3);for(let yy=top+8;yy<top+hh;yy+=10){X.fillStyle='rgba(0,0,0,'+(((yy-top)%20===0)?0.08:0.04)+')';X.fillRect(x,yy,ww,4);}X.fillStyle='rgba(20,40,70,.55)';for(let i=0;i<ww;i+=16)for(let yy=top+14;yy<top+hh;yy+=22)X.fillRect(x+i+3,yy+((i/16)%2)*3,4,3);X.fillStyle='rgba(255,255,255,.06)';X.fillRect(x,top,ww,1);}else if(form==='stones'){X.fillStyle=b.g2;X.fillRect(x,top,ww,hh);for(let yy=top+4;yy<top+hh;yy+=14){X.fillStyle='rgba(0,0,0,.35)';X.fillRect(x,yy,ww,1);for(let i=0;i<ww;i+=18){X.fillStyle=b.g1;X.fillRect(x+i+3,yy+2,12,10);X.fillStyle='rgba(255,255,255,.2)';X.fillRect(x+i+4,yy+3,10,2);X.fillStyle='rgba(0,0,0,.4)';X.fillRect(x+i+3,yy+11,12,2);}}X.fillStyle=b.g1;X.fillRect(x,top,ww,4);}else if(form==='structures'){X.fillStyle='#1a2840';X.fillRect(x,top,ww,hh);X.fillStyle=b.g1;X.fillRect(x,top,ww,6);for(let yy=top+8;yy<top+hh;yy+=18){X.fillStyle='rgba(0,0,0,.35)';X.fillRect(x,yy,ww,2);for(let i=0;i<ww;i+=12){X.fillStyle=b.g2;X.fillRect(x+i+1,yy+3,10,8);X.fillStyle=b.g1;X.fillRect(x+i+2,yy+4,8,1);X.fillStyle='#ff9f43';if((i+yy)%30===0)X.fillRect(x+i+5,yy+6,2,2);}}}const grd=X.createLinearGradient(0,top,0,top+8);grd.addColorStop(0,'rgba(255,255,255,.12)');grd.addColorStop(1,'rgba(255,255,255,0)');X.fillStyle=grd;X.fillRect(x,top,ww,8);X.fillStyle='rgba(0,0,0,.35)';X.fillRect(x+ww-3,top+4,3,hh-4);if(p.breaking!==undefined){X.fillStyle='rgba(255,180,60,'+(p.breaking/0.4*0.4)+')';X.fillRect(x,top,ww,hh);X.fillStyle='rgba(0,0,0,.6)';X.fillRect(x+ww*0.3,top,2,hh);X.fillRect(x+ww*0.6,top,2,hh);}}
function drawPlatform(p,x){const b=curBiome();if(p.type==='g'){drawGroundForm(p,x,b);}else if(p.type==='f'){X.fillStyle=b.flt2;X.fillRect(x,p.y,p.w,p.h);X.fillStyle=b.flt1;X.fillRect(x,p.y,p.w,4);X.fillStyle='rgba(255,255,255,.3)';X.fillRect(x,p.y,p.w,1);const glow=X.createLinearGradient(0,p.y+p.h,0,p.y+p.h+6);glow.addColorStop(0,b.fltGlow);glow.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=glow;X.fillRect(x,p.y+p.h,p.w,6);}else{X.fillStyle=b.flt2;X.fillRect(x,p.y,p.w,p.h);X.fillStyle=b.flt1;X.fillRect(x,p.y,p.w,3);X.fillStyle='rgba(255,255,255,.2)';X.fillRect(x+2,p.y+3,p.w-4,2);}}
function drawHazard(h){const x=Math.round(h.x-G.camX),y=Math.round(h.y);if(x>W+40||x+h.w<-40)return;if(h.type==='spike'){X.fillStyle='#c9d6e8';for(let i=0;i<h.w;i+=8){X.beginPath();X.moveTo(x+i,h.y+8);X.lineTo(x+i+4,h.y);X.lineTo(x+i+8,h.y+8);X.closePath();X.fill();X.fillStyle='rgba(0,0,0,.35)';X.beginPath();X.moveTo(x+i+4,h.y);X.lineTo(x+i+8,h.y+8);X.lineTo(x+i+5,h.y+8);X.closePath();X.fill();X.fillStyle='#c9d6e8';}X.fillStyle='#6d7f96';X.fillRect(x,h.y+7,h.w,2);}else if(h.type==='saw'){const sc=h.scale||1;const cx=x+h.w/2,cy=h.y+h.h/2;X.save();X.translate(cx,cy);X.scale(sc,sc);X.rotate(h.ph*3);X.fillStyle='#c0c8d8';for(let i=0;i<8;i++){X.save();X.rotate(i*Math.PI/4);X.beginPath();X.moveTo(0,0);X.lineTo(6,-2);X.lineTo(8,0);X.lineTo(6,2);X.closePath();X.fill();X.restore();}X.fillStyle='#7a8090';X.beginPath();X.arc(0,0,3,0,6.283);X.fill();X.fillStyle='#3a4050';X.beginPath();X.arc(0,0,1.5,0,6.283);X.fill();X.restore();}else if(h.type==='pitfloor'){X.fillStyle='#06060c';X.fillRect(x,h.y,h.w,h.h);X.fillStyle='#1a1a2a';X.fillRect(x,h.y,h.w,1);X.fillStyle='#0a0a15';X.fillRect(x,h.y+h.h-2,h.w,2);X.fillStyle='rgba(180,200,255,.06)';for(let i=0;i<h.w;i+=6)X.fillRect(x+i,h.y+2,2,h.h-4);}else if(h.type==='mine'){if(h.exploded){const t=1-Math.max(0,h.explT/0.6);const cx=x+h.w/2,cy=h.y+h.h/2;const maxR=70;if(t<1){if(t<0.75){const r1=maxR*t*1.6;const a1=1-t/0.75;X.strokeStyle='rgba(255,230,150,'+a1+')';X.lineWidth=4*a1;X.beginPath();X.arc(cx,cy,r1,0,6.283);X.stroke();}if(t>0.15&&t<0.9){const t2=(t-0.15)/0.75;const r2=maxR*t2*1.3;const a2=1-t2;X.strokeStyle='rgba(255,160,70,'+a2+')';X.lineWidth=3*a2;X.beginPath();X.arc(cx,cy,r2,0,6.283);X.stroke();}const cr=maxR*0.75*(t<0.25?t/0.25:Math.max(0,1-(t-0.25)/0.75));if(cr>0.5){const grd=X.createRadialGradient(cx,cy,0,cx,cy,cr);grd.addColorStop(0,'rgba(255,255,255,'+Math.max(0,1-t*2.8)+')');grd.addColorStop(0.3,'rgba(255,230,140,'+Math.max(0,1-t*1.8)+')');grd.addColorStop(0.6,'rgba(255,120,50,'+Math.max(0,1-t*1.1)+')');grd.addColorStop(1,'rgba(160,30,10,0)');X.fillStyle=grd;X.beginPath();X.arc(cx,cy,cr,0,6.283);X.fill();}if(t>0.35){const sa=(t-0.35)/0.65;const sr=maxR*(0.6+sa*0.5);const sy=cy-sa*22;const grd=X.createRadialGradient(cx,sy,0,cx,sy,sr);grd.addColorStop(0,'rgba(90,70,60,'+sa*0.5+')');grd.addColorStop(1,'rgba(20,15,10,0)');X.fillStyle=grd;X.beginPath();X.arc(cx,sy,sr,0,6.283);X.fill();}}}else{X.fillStyle=h.armed?'#c03010':'#3a3a4a';X.beginPath();X.arc(x+5,h.y+5,5,0,6.283);X.fill();X.fillStyle='#1a1a2e';X.beginPath();X.arc(x+5,h.y+5,3,0,6.283);X.fill();if(h.armed){const pulse=0.5+0.5*Math.sin(G.t*20);X.fillStyle='rgba(255,60,60,'+pulse+')';X.beginPath();X.arc(x+5,h.y-2,2,0,6.283);X.fill();}}}else if(h.type==='pitfloor'){X.fillStyle='#06060c';X.fillRect(x,h.y,h.w,h.h);X.fillStyle='#1a1a2a';X.fillRect(x,h.y,h.w,1);X.fillStyle='#0a0a15';X.fillRect(x,h.y+h.h-2,h.w,2);}else if(h.type==='lance'){const cx=x+h.w/2,cy=h.y;const grd=X.createLinearGradient(0,h.y+h.h,0,h.y);grd.addColorStop(0,'#8899aa');grd.addColorStop(1,'#e8f0ff');X.fillStyle=grd;X.beginPath();X.moveTo(x,h.y+h.h);X.lineTo(cx,h.y-2);X.lineTo(x+h.w,h.y+h.h);X.closePath();X.fill();X.fillStyle='rgba(0,0,0,.4)';X.beginPath();X.moveTo(cx,h.y-2);X.lineTo(x+h.w,h.y+h.h);X.lineTo(x+h.w*0.75,h.y+h.h);X.closePath();X.fill();X.fillStyle='rgba(255,255,255,.8)';X.beginPath();X.arc(cx,h.y,1.5,0,6.283);X.fill();}else{const o=Math.sin(G.t*3)*2;const grd=X.createLinearGradient(0,h.y+o,0,h.y+o+h.h);grd.addColorStop(0,'#ffe14a');grd.addColorStop(0.4,'#ff6a1a');grd.addColorStop(1,'#7a1000');X.fillStyle=grd;X.fillRect(x,h.y+o,h.w,h.h);X.fillStyle='rgba(255,220,120,.55)';for(let i=0;i<h.w;i+=14)X.fillRect(x+i,h.y+o+4+((i+G.t*30)%8),6,2);}}
function drawWorld(){for(const p of LV.plats){const x=Math.round(p.x-G.camX);if(x>W+40||x+p.w<-40)continue;drawPlatform(p,x);}for(const h of LV.haz)drawHazard(h);for(const it of LV.items){const x=Math.round(it.x-G.camX);const y=Math.round(it.y+Math.sin(it.t*3)*2);if(x>W+30||x<-30)continue;const col=colForType(it.type);const cx=x+7,cy=y+7;const grd=X.createRadialGradient(cx,cy,2,cx,cy,13);grd.addColorStop(0,col);grd.addColorStop(0.5,'rgba(0,0,0,.85)');grd.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=grd;X.beginPath();X.arc(cx,cy,13,0,6.283);X.fill();X.fillStyle='#0a1424';X.beginPath();X.arc(cx,cy,6,0,6.283);X.fill();X.strokeStyle=col;X.lineWidth=1;X.beginPath();X.arc(cx,cy,5.5,0,6.283);X.stroke();drawItemIcon(it.type,cx,cy,col);}}
function drawItemIcon(type,cx,cy,col){X.save();X.textAlign='center';X.textBaseline='middle';X.font='900 7px "Font Awesome 6 Free"';X.fillStyle=col;X.fillText(FA_ICONS[type]||'\uf005',cx,cy);X.restore();}
function drawPlayer(){if(P.dead)return;if(P.invuln>0&&Math.floor(G.t*22)%2===0)return;const x=Math.round(P.x-G.camX),y=Math.round(P.y),f=P.face;const moving=Math.abs(P.vx)>10&&P.onGround;const jump=!P.onGround;const legPhase=moving?Math.sin(P.walkT):0;const legY1=jump?-3:Math.round(Math.max(0,legPhase)*2);const legY2=jump?-3:Math.round(Math.max(0,-legPhase)*2);const bob=moving?Math.round(Math.abs(Math.sin(P.walkT*2))):0;const blink=(P.blinkT%3.2)<0.12;X.fillStyle='rgba(0,0,0,.35)';X.beginPath();X.ellipse(x+6,y+P.h-0.5,5,1.5,0,0,6.283);X.fill();X.fillStyle='#2a3a5a';X.fillRect(x+3,y+12+legY1,3,3);X.fillStyle='#1a1a2e';X.fillRect(x+2,y+15+legY1,4,2);X.fillStyle='#2a3a5a';X.fillRect(x+6,y+12+legY2,3,3);X.fillStyle='#1a1a2e';X.fillRect(x+6,y+15+legY2,4,2);X.fillStyle='#1a1a2e';X.fillRect(x+2,y+11,8,2);X.fillStyle='#e04a32';X.fillRect(x+2,y+6+bob,8,5);X.fillStyle='#ff6b4a';X.fillRect(x+2,y+6+bob,8,1);X.fillStyle='#a02010';X.fillRect(x+8,y+7+bob,2,4);X.fillStyle='#ffe14a';X.fillRect(x+5,y+8+bob,2,2);X.fillStyle='#ff8a5c';X.fillRect(x+1,y+6+bob,2,3);X.fillRect(x+9,y+6+bob,2,3);X.fillStyle='#ffcf9e';X.fillRect(x+3,y+2+bob,6,4);X.fillStyle='#e0a880';X.fillRect(x+3,y+5+bob,6,1);X.fillStyle='#39d0ff';X.fillRect(x+2,y+0+bob,8,3);X.fillStyle='#7fe0ff';X.fillRect(x+3,y+1+bob,6,1);X.fillStyle='#1a8aaa';X.fillRect(x+2,y+2+bob,8,1);X.fillStyle='#ff6b4a';X.fillRect(x+9,y-3+bob,1,3);X.fillStyle='#ffe14a';X.fillRect(x+9,y-4+bob,1,1);X.fillStyle='#0b1220';X.fillRect(x+3,y+3+bob,6,1);if(!blink){X.fillStyle='#fff';X.fillRect(x+(f>0?6:3),y+4+bob,2,1);X.fillStyle='#0b1220';X.fillRect(x+(f>0?7:3),y+4+bob,1,1);}X.fillStyle='#e04a32';const armX=x+(f>0?10:0);X.fillRect(armX,y+7+bob,2,4);drawWeapon(x,y,bob,f);if(P.shootCd>0.12){const mx=x+(f>0?12:-2),my=y+7+bob;const flash=X.createRadialGradient(mx,my,0,mx,my,8);flash.addColorStop(0,'rgba(255,255,200,1)');flash.addColorStop(0.4,'rgba(255,225,74,.8)');flash.addColorStop(1,'rgba(255,200,74,0)');X.fillStyle=flash;X.fillRect(mx-8,my-8,16,16);}if(P.s llStyle='#ffe14a';X.beginPath();X.arc(mx,my,2.5,0,6.283);X.fill();}}
function heart(x,y,on){X.fillStyle=on?'#ff3b5c':'#2a1620';X.fillRect(x+1,y,2,1);X.fillRect(x+4,y,2,1);X.fillRect(x,y+1,7,2);X.fillRect(x+1,y+3,5,1);X.fillRect(x+2,y+4,3,1);X.fillRect(x+3,y+5,1,1);}
function drawHud(){X.textBaseline='top';X.font='bold 13px monospace';for(let i=0;i<P.maxHp;i++)heart(8+i*9,8,i<P.hp);X.fillStyle='#9fd6ff';X.fillText('x'+Math.max(0,G.lives),10+P.maxHp*9,8);X.textAlign='right';X.font='bold 11px monospace';X.fillStyle=DIFF_COLOR[CFG.difficulty]||'#7fe0ff';X.fillText('NIVEL '+G.level,W-8,9);X.fillStyle='#a97bff';X.fillText(CFG.difficulty.toUpperCase(),W-8,21);X.textAlign='center';X.font='bold 12px monospace';X.fillStyle='rgba(0,0,0,.55)';X.fillRect(W/2-30,H-26,60,12);X.fillStyle='rgba(200,230,255,.95)';X.fillText(curBiome().name,W/2,H-25);X.textAlign='left';const wn=P.weapon==='spread'?'TRIPLE':P.weapon==='laser'?'LÁSER':'NORMAL';X.font='italic bold 11px "Courier New",monospace';X.fillStyle='rgba(0,0,0,.55)';X.fillRect(4,H-19,90,14);X.fillStyle=P.weapon==='spread'?'#ff9f43':P.weapon==='laser'?'#7ff0ff':'#d8e0ec';X.fillText('✦ '+wn+(P.rapidT>0?' +RAPID':''),8,H-17);if(P.shield>0){X.font='bold 12px monospace';X.fillStyle='rgba(0,0,0,.55)';X.fillRect(4,H-35,80,14);X.fillStyle='#7fe0ff';X.fillText('ESCUDO '+Math.ceil(P.shield),8,H-33);}if(G.flashT>0){X.globalAlpha=Math.min(0.6,G.flashT*1.5);X.fillStyle=G.flashColor;X.fillRect(0,0,W,H);X.globalAlpha=1;}if(G.msgT>0){X.textAlign='center';X.font='bold 11px monospace';X.globalAlpha=Math.min(1,G.msgT);const tw=X.measureText(G.msg).width;X.fillStyle='rgba(0,0,0,.82)';X.fillRect(W/2-tw/2-8,6,tw+16,16);X.strokeStyle=G.msgC;X.lineWidth=1;X.strokeRect(W/2-tw/2-8.5,6.5,tw+17,15);X.fillStyle=G.msgC;X.fillText(G.msg,W/2,8);X.globalAlpha=1;X.textAlign='left';}const boss=LV.boss;if(boss&&!boss.dead){const bsx=boss.x-G.camX+boss.w/2;if(bsx>-80&&bsx<W+80){const cx=clamp(bsx,90,W-90);const cy=Math.max(30,boss.y-22);X.globalAlpha=0.9;X.textAlign='center';X.font='bold 11px monospace';const bn=boss.bossName||'JEFE';const tw=X.measureText(bn).width;X.fillStyle='rgba(0,0,0,.75)';X.fillRect(cx-tw/2-6,cy-14,tw+12,14);X.strokeStyle=boss.design?boss.design.c3:'#ff9fb0';X.lineWidth=1;X.strokeRect(cx-tw/2-5.5,cy-13.5,tw+11,13);X.fillStyle=boss.design?boss.design.c3:'#ff9fb0';X.fillText(bn,cx,cy-11);const bw=110;X.fillStyle='rgba(0,0,0,.75)';X.fillRect(cx-bw/2,cy+2,bw,8);X.fillStyle='#ff3b5c';X.fillRect(cx-bw/2+1,cy+3,(bw-2)*Math.max(0,boss.hp/boss.maxHp),6);X.fillStyle='#ffe14a';X.font='bold 9px monospace';X.fillText(Math.ceil(boss.hp)+'/'+boss.maxHp,cx,cy+12);X.globalAlpha=1;X.textAlign='left';}}}
function render(){X.setTransform(1,0,0,1,0,0);X.textBaseline='top';let sx=0,sy=0;if(G.shake>0){sx=rnd(-G.shake,G.shake)*0.5;sy=rnd(-G.shake,G.shake)*0.5;}X.save();X.translate(Math.round(sx),Math.round(sy));drawBg();if(LV){drawWeather();drawWorld();for(const e of LV.ens)if(!e.dead)drawEnemy(e);drawPlayer();drawBullets();drawPT();drawHud();if(G.state==='bossDefeat'){const a=Math.max(0,G.bossDefeatT/1.6);X.fillStyle='rgba(255,255,255,'+(a*0.4)+')';X.fillRect(0,0,W,H);}}const vg=X.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.35)');X.fillStyle=vg;X.fillRect(0,0,W,H);X.restore();}
let last=0;
function loop(ts){requestAnimationFrame(loop);if(!last)last=ts;let dt=(ts-last)/1000;last=ts;if(dt>0.05)dt=0.05;if(G.state==='play'||G.state==='bossDefeat')update(dt);else G.t+=dt;render();}
document.fonts.ready.then(()=>{render();});
menu();
requestAnimationFrame(loop);
</script>
</body>
