function drawBg(){const blend=getBlend(),b=blend.biome,prev=blend.prev||b,t=blend.t,idx=curBiomeIdx(),sky1=mixCol(prev.sky1,b.sky1,t),sky2=mixCol(prev.sky2,b.sky2,t),m2=mixCol(prev.m2,b.m2,t),m1=mixCol(prev.m1,b.m1,t),g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,sky1);g.addColorStop(0.55,sky2);g.addColorStop(1,m2);X.fillStyle=g;X.fillRect(0,0,W,H);drawCelestial(idx);if(b.weather==='stars'){for(let i=0;i<30;i++){const sx=((i*97.3-G.camX*0.12)%(W+40)+W+40)%(W+40)-20,sy=(i*53)%160,tw=Math.sin(G.t*2+i)*0.5+0.5,grd=X.createRadialGradient(sx,sy,0,sx,sy,2.5);grd.addColorStop(0,'rgba(220,235,255,'+(0.4+tw*0.6)+')');grd.addColorStop(1,'rgba(180,220,255,0)');X.fillStyle=grd;X.beginPath();X.arc(sx,sy,2.5,0,6.283);X.fill();}}drawLandscape(idx,0,0.28,m1);drawLandscape(idx,1,0.5,m2);X.fillStyle=m2;X.fillRect(0,GY-1,W,H-GY+1);if(b.tint){X.fillStyle=b.tint;X.fillRect(0,0,W,H);}if(G.lightningT>0){X.fillStyle='rgba(240,250,255,'+Math.min(0.9,G.lightningT*4)+')';X.fillRect(0,0,W,H);}}
function drawEventFX(){
if(G.fx.lowGrav>0){const a=Math.min(0.6,G.fx.lowGrav/7);for(let i=0;i<30;i++){const px=((i*127.3+G.t*18)%(W+40)+W+40)%(W+40)-20,py=H-((i*83.7+G.t*26)%(H+40))-20,tw=0.5+Math.sin(G.t*2.5+i*1.3)*0.5,s=1+(i%3)*0.6;X.fillStyle='rgba(140,180,255,'+(a*tw*0.65)+')';X.beginPath();X.arc(px,py,s,0,6.283);X.fill();X.fillStyle='rgba(120,160,255,'+(a*tw*0.25)+')';X.fillRect(px-0.5,py-s,1,s*2.5);}}
if(G.fx.wind>0){
const a=Math.min(0.9,G.fx.wind/7),dir=G.windDir,intensity=0.75+0.25*Math.sin(G.t*2.2);
const wash=X.createLinearGradient(dir>0?0:W,0,dir>0?W:0,0);
wash.addColorStop(0,'rgba(140,190,255,0)');
wash.addColorStop(0.55,'rgba(165,210,255,'+(a*0.10*intensity)+')');
wash.addColorStop(1,'rgba(210,238,255,'+(a*0.28*intensity)+')');
X.fillStyle=wash;X.fillRect(0,0,W,H);
for(let layer=0;layer<3;layer++){
const ls=0.7+layer*0.4,la=[0.45,0.65,0.85][layer],lw=[4.0,2.6,1.4][layer];
for(let i=0;i<2;i++){
const baseY=(i*H/2+(G.t*120*dir*ls)%H+H)%H,phase=i*1.9+layer*0.7;
X.beginPath();
for(let x=-40;x<=W+40;x+=7){
const t=(x/W)*Math.PI*2;
const y=baseY+Math.sin(t*1.2+phase+G.t*2.8*ls)*18+Math.cos(t*2.4+G.t*1.8)*6+Math.sin(t*0.8+G.t*1.1)*4;
if(x===-40)X.moveTo(x,y);else X.lineTo(x,y);
}
X.strokeStyle='rgba(120,180,250,'+(a*la*0.55*intensity)+')';
X.lineWidth=lw*3.5;X.stroke();

X.lineWidth=lw;X.stroke();
}
}
for(let i=0;i<10;i++){
const ly=(i*H/10+((G.t*85*dir)%H)+H)%H;
const lxStart=dir>0?((G.t*320+i*53)%(W+140))-70:W-((G.t*320+i*53)%(W+140))+70;
const lLen=90+i*8;

X.lineWidth=1.2;
X.beginPath();X.moveTo(lxStart,ly);
for(let j=1;j<=4;j++){
const dx=(lLen/4)*dir*j,dy=Math.sin(G.t*3+j*0.6+i)*3;
X.lineTo(lxStart+dx,ly+dy);
}

}
}
if(G.fx.meteor>0){const a=Math.min(0.4,G.fx.meteor/7),g=X.createRadialGradient(W/2,H,0,W/2,H,H*1.3);g.addColorStop(0,'rgba(255,100,30,'+(a*0.22)+')');g.addColorStop(1,'rgba(255,50,10,0)');X.fillStyle=g;X.fillRect(0,0,W,H);}}

function drawPlatform(p,x){const b=curBiome();

else if(h.type==='lance'){const cx=x+h.w/2,cy=h.y,grd=X.createLinearGradient(0,h.y+h.h,0,h.y);grd.addColorStop(0,'#8899aa');grd.addColorStop(1,'#e8f0ff');X.fillStyle=grd;X.beginPath();X.moveTo(x,h.y+h.h);X.lineTo(cx,h.y-2);X.lineTo(x+h.w,h.y+h.h);X.closePath();X.fill();X.fillStyle='rgba(0,0,0,.4)';X.beginPath();X.moveTo(cx,h.y-2);X.lineTo(x+h.w,h.y+h.h);X.lineTo(x+h.w*0.75,h.y+h.h);X.closePath();X.fill();X.fillStyle='rgba(255,255,255,.8)';X.beginPath();X.arc(cx,h.y,1.5,0,6.283);X.fill();}
else if(h.type==='spikeCol'){X.fillStyle='#5a5a6a';X.fillRect(x,h.y,h.w,h.h);X.fillStyle='#8a8a9a';X.fillRect(x+1,h.y,h.w-2,1);X.fillStyle='#c0c8d8';X.beginPath();X.moveTo(x,h.y);X.lineTo(x+h.w/2,h.y-8);X.lineTo(x+h.w,h.y);X.closePath();X.fill();X.fillStyle='rgba(0,0,0,.4)';X.beginPath();X.moveTo(x+h.w/2,h.y-8);X.lineTo(x+h.w,h.y);X.lineTo(x+h.w*0.75,h.y);X.closePath();X.fill();X.fillStyle='rgba(255,255,255,.7)';X.fillRect(x+2,h.y+2,1,h.h-4);}
else{const o=Math.sin(G.t*3)*2,grd=X.createLinearGradient(0,h.y+o,0,h.y+o+h.h);grd.addColorStop(0,'#ffe14a');grd.addColorStop(0.4,'#ff6a1a');grd.addColorStop(1,'#7a1000');X.fillStyle=grd;X.fillRect(x,h.y+o,h.w,h.h);X.fillStyle='rgba(255,220,120,.55)';for(let i=0;i<h.w;i+=14)X.fillRect(x+i,h.y+o+4+((i+G.t*30)%8),6,2);}}

if(G.flashT>0){X.globalAlpha=Math.min(0.6,G.flashT*1.5);X.fillStyle=G.flashColor;X.fillRect(0,0,W,H);X.globalAlpha=1;}
if(G.msgT>0){X.textAlign='center';X.font='bold 11px monospace';X.globalAlpha=Math.min(1,G.msgT);const tw=X.measureText(G.msg).width;X.fillStyle='rgba(0,0,0,.82)';X.fillRect(W/2-tw/2-8,6,tw+16,16);X.strokeStyle=G.msgC;X.lineWidth=1;X.strokeRect(W/2-tw/2-8.5,6.5,tw+17,15);X.fillStyle=G.msgC;X.fillText(G.msg,W/2,8);X.globalAlpha=1;X.textAlign='left';}
const boss=LV.boss;if(boss&&!boss.dead){const bx1=boss.x-G.camX,bx2=bx1+boss.w;if(bx1>-20&&bx2<W+20){const cx=clamp((bx1+bx2)/2,80,W-80),cy=Math.max(24,boss.y-24),bn=boss.bossName||'JEFE';X.globalAlpha=0.94;X.textAlign='center';X.font='bold 11px monospace';const tw=X.measureText(bn).width,panelW=Math.max(tw+14,136);X.fillStyle='rgba(0,0,0,.82)';X.fillRect(cx-panelW/2,cy-14,panelW,30);X.strokeStyle=boss.design?boss.design.c3:'#ff9fb0';X.lineWidth=1;X.strokeRect(cx-panelW/2+0.5,cy-13.5,panelW-1,29);X.fillStyle=boss.design?boss.design.c3:'#ff9fb0';X.fillText(bn,cx,cy-11);const bw=118;X.fillStyle='rgba(0,0,0,.78)';X.fillRect(cx-bw/2,cy+2,bw,9);const hpPct=Math.max(0,boss.hp/boss.maxHp);X.fillStyle='#ff3b5c';X.fillRect(cx-bw/2+1,cy+3,(bw-2)*hpPct,7);X.fillStyle='rgba(255,255,255,.35)';X.fillRect(cx-bw/2+1,cy+3,(bw-2)*hpPct,2);X.fillStyle='#ffe14a';X.font='bold 9px monospace';X.fillText(Math.ceil(boss.hp)+'/'+boss.maxHp,cx,cy+13);X.fillStyle='rgba(0,0,0,.82)';X.beginPath();X.moveTo(cx-5,cy+16);X.lineTo(cx+5,cy+16);X.lineTo(cx,cy+22);X.closePath();X.fill();X.globalAlpha=1;X.textAlign='left';}}}
function drawDarkOverlay(){if(G.fx.dark<=0)return;const a=Math.min(0.75,G.fx.dark/7),px=P.x-G.camX+6,py=P.y+8,radius=95+Math.sin(G.t*2)*8,grd=X.createRadialGradient(px,py,radius*0.4,px,py,radius*1.6);grd.addColorStop(0,'rgba(0,0,10,0)');grd.addColorStop(0.5,'rgba(5,0,20,'+(a*0.55)+')');grd.addColorStop(1,'rgba(0,0,8,'+(a*0.92)+')');X.fillStyle=grd;X.fillRect(0,0,W,H);}
function render(){X.setTransform(1,0,0,1,0,0);X.textBaseline='top';let sx=0,sy=0;if(G.shake>0){sx=rnd(-G.shake,G.shake)*0.5;sy=rnd(-G.shake,G.shake)*0.5;}X.save();X.translate(Math.round(sx),Math.round(sy));drawBg();if(LV){drawEventFX();drawWeather();drawWorld();for(const e of LV.ens)if(!e.dead)drawEnemy(e);drawPlayer();drawBullets();drawPT();drawDarkOverlay();
if(G.state==='bossDefeat'){const a=Math.max(0,G.bossDefeatT/1.8);X.fillStyle='rgba(255,255,255,'+(a*0.5)+')';X.fillRect(0,0,W,H);}
if(G.state==='teleporting'){const t=1-G.teleportT/0.8;X.strokeStyle='rgba(127,224,255,'+(1-t)+')';X.lineWidth=4*(1-t)+1;for(let i=0;i<5;i++){const r=t*220+i*35;X.beginPath();X.arc(P.x-G.camX+6,P.y+8,r,0,6.283);X.stroke();}X.fillStyle='rgba(255,255,255,'+(t*0.7)+')';X.fillRect(0,0,W,H);}
drawHud();}
const vg=X.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.35)');X.fillStyle=vg;X.fillRect(0,0,W,H);X.restore();}
let last=0;const _tbBtns=Array.from(document.querySelectorAll('.tb'));
function _anyTBOn(){for(const b of _tbBtns){if(b.classList.contains('on'))return true;}return false;}
let _pauseIdleT=0,_pauseShown=false;const _PAUSE_GRACE=1.5;
function updatePauseBtn(){const b=document.getElementById('btnPause');if(!b)return;if(!(IS_TOUCH&&G.state==='play')){_pauseIdleT=0;if(_pauseShown){b.classList.remove('show');_pauseShown=false;}return;}if(_anyTBOn()){_pauseIdleT=0;if(_pauseShown){b.classList.remove('show');_pauseShown=false;}return;}_pauseIdleT+=1/60;if(_pauseIdleT>=_PAUSE_GRACE&&!_pauseShown){b.classList.add('show');_pauseShown=true;}}
function loop(ts){requestAnimationFrame(loop);if(!last)last=ts;let dt=(ts-last)/1000;last=ts;if(dt>0.05)dt=0.05;if(G.state==='play'||G.state==='bossDefeat'||G.state==='teleporting')update(dt);else G.t+=dt;updatePauseBtn();render();}
document.fonts.ready.then(()=>{render();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')togglePause();});
window.addEventListener('blur',()=>{if(G.state==='play')togglePause();});
menu();requestAnimationFrame(loop);
</script>
