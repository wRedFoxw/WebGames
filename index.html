t(bx+2,by+2,0,bx+2,by+2,8);grd.addColorStop(0,'#fff2a0');grd.addColorStop(0.4,b.color||'#ff5a3c');grd.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=grd;X.fillRect(bx-4,by-4,12,12);X.fillStyle=b.color||'#ff5a3c';X.fillRect(bx,by,4,4);X.fillRect(bx-2,by+2,2,2);X.fillRect(bx+2,by-2,2,2);X.fillStyle='#fff2a0';X.fillRect(bx+1,by+1,2,2);}}}for(const bo of BOMBS){const bx=Math.round(bo.x-G.camX),by=Math.round(bo.y);if(bo.exploded){const t=1-bo.life/0.6,r=30*(1-t);X.fillStyle='rgba(255,120,50,'+(1-t)+')';X.beginPath();X.arc(bx,by,r,0,6.283);X.fill();}else{X.fillStyle='#2a2a3a';X.beginPath();X.arc(bx,by,5,0,6.283);X.fill();X.fillStyle='#ff6b4a';X.beginPath();X.arc(bx,by,2.5,0,6.283);X.fill();X.fillStyle='#ffe14a';X.fillRect(bx-1,by-7,2,3);}}for(const m of MT){const mx=Math.round(m.x-G.camX),my=Math.round(m.y);if(m.rock){const s=m.size||4;X.fillStyle='#4a4a5a';X.fillRect(mx-s/2,my-s/2,s,s);X.fillStyle='#7a7a8a';X.fillRect(mx-s/2+1,my-s/2+1,s-2,2);}else{const trailGrd=X.createLinearGradient(mx,my-20,mx,my);trailGrd.addColorStop(0,'rgba(255,60,20,0)');trailGrd.addColorStop(1,'rgba(255,180,60,.6)');X.fillStyle=trailGrd;X.beginPath();X.moveTo(mx-3,my-20);X.lineTo(mx+3,my-20);X.lineTo(mx+2,my);X.lineTo(mx-2,my);X.closePath();X.fill();const grd=X.createRadialGradient(mx,my,0,mx,my,11);grd.addColorStop(0,'#ffe14a');grd.addColorStop(0.4,'#ff8a3c');grd.addColorStop(1,'rgba(255,120,60,0)');X.fillStyle=grd;X.beginPath();X.arc(mx,my,11,0,6.283);X.fill();X.fillStyle='#ffe14a';X.beginPath();X.arc(mx,my,3,0,6.283);X.fill();}}for(const f of FB){const fx=Math.round(f.x-G.camX),fy=Math.round(f.y),grd=X.createRadialGradient(fx,fy,0,fx,fy,f.r*3);grd.addColorStop(0,'#fff2a0');grd.addColorStop(0.25,'#ffe14a');grd.addColorStop(0.55,'#ff8a3c');grd.addColorStop(1,'rgba(255,60,20,0)');X.fillStyle=grd;X.beginPath();X.arc(fx,fy,f.r*3,0,6.283);X.fill();X.fillStyle='#fff2a0';X.beginPath();X.arc(fx,fy,f.r*0.5,0,6.283);X.fill();}}
function heart(x,y,on){X.fillStyle=on?'#ff3b5c':'#2a1620';X.fillRect(x+1,y,2,1);X.fillRect(x+4,y,2,1);X.fillRect(x,y+1,7,2);X.fillRect(x+1,y+3,5,1);X.fillRect(x+2,y+4,3,1);X.fillRect(x+3,y+5,1,1);}
function drawHud(){X.textBaseline='top';X.font='bold 11px monospace';for(let i=0;i<P.maxHp;i++)heart(8+i*9,8,i<P.hp);X.fillStyle='#9fd6ff';X.fillText('x'+Math.max(0,G.lives),10+P.maxHp*9,9);
X.textAlign='center';X.font='bold 16px monospace';X.fillStyle='#ffe14a';X.fillText(G.score,W/2,7);
X.font='bold 8px monospace';X.fillStyle='#8a8a9a';X.fillText('PUNTOS',W/2,26);
X.textAlign='right';X.font='bold 10px monospace';X.fillStyle=DIFF_COLOR[CFG.difficulty]||'#7fe0ff';X.fillText('NIVEL '+G.level,W-8,9);X.fillStyle='#a97bff';X.fillText(CFG.difficulty.toUpperCase(),W-8,20);
X.textAlign='center';X.font='bold 12px monospace';X.fillStyle='rgba(0,0,0,.55)';X.fillRect(W/2-35,H-26,70,12);X.fillStyle='rgba(200,230,255,.95)';X.fillText(curBiome().name,W/2,H-25);X.textAlign='left';
const wn=P.weapon==='spread'?'TRIPLE':P.weapon==='laser'?'LÁSER':'NORMAL';X.font='italic bold 11px "Courier New",monospace';X.fillStyle='rgba(0,0,0,.55)';X.fillRect(4,H-19,90,14);X.fillStyle=P.weapon==='spread'?'#ff9f43':P.weapon==='laser'?'#7ff0ff':'#d8e0ec';X.fillText('✦ '+wn+(P.rapidT>0?' +RAPID':''),8,H-17);
if(P.shield>0){X.font='bold 12px monospace';X.fillStyle='rgba(0,0,0,.55)';X.fillRect(4,H-35,80,14);X.fillStyle='#7fe0ff';X.fillText('ESCUDO '+Math.ceil(P.shield),8,H-33);}
if(P.slowT>0){X.font='bold 11px monospace';X.fillStyle='rgba(0,0,0,.55)';X.fillRect(4,H-49,72,12);X.fillStyle='#a97bff';X.fillText('LENTO '+Math.ceil(P.slowT),8,H-47);}
if(G.flashT>0){X.globalAlpha=Math.min(0.6,G.flashT*1.5);X.fillStyle=G.flashColor;X.fillRect(0,0,W,H);X.globalAlpha=1;}
if(G.msgT>0){X.textAlign='center';X.font='bold 11px monospace';X.globalAlpha=Math.min(1,G.msgT);const tw=X.measureText(G.msg).width;X.fillStyle='rgba(0,0,0,.82)';X.fillRect(W/2-tw/2-8,36,tw+16,16);X.strokeStyle=G.msgC;X.lineWidth=1;X.strokeRect(W/2-tw/2-8.5,36.5,tw+17,15);X.fillStyle=G.msgC;X.fillText(G.msg,W/2,38);X.globalAlpha=1;X.textAlign='left';}
const boss=(LV.finalBoss&&!LV.finalBoss.dead)?LV.finalBoss:(LV.boss&&!LV.boss.dead?LV.boss:null);if(boss){const bx1=boss.x-G.camX,bx2=bx1+boss.w;if(bx1>-20&&bx2<W+20){const cx=clamp((bx1+bx2)/2,80,W-80),cy=Math.max(40,boss.y-50),bn=boss.bossName||'JEFE';X.globalAlpha=0.95;X.textAlign='center';X.font='bold 12px monospace';const tw=X.measureText(bn).width;
X.fillStyle='rgba(0,0,0,.6)';X.fillRect(cx-tw/2-6,cy-14,tw+12,16);
X.fillStyle=boss.isFinal?'#ff3b5c':'#7fe0ff';X.fillText(bn,cx,cy-12);
const bw=140,hpPct=Math.max(0,boss.hp/boss.maxHp);
if(boss.isFinal&&boss.maxArmor){const armPct=Math.max(0,boss.armor/boss.maxArmor);X.fillStyle='rgba(0,0,0,.6)';X.fillRect(cx-bw/2,cy+2,bw,4);X.fillStyle='#7fe0ff';X.fillRect(cx-bw/2,cy+2,bw*armPct,4);X.fillStyle='rgba(0,0,0,.6)';X.fillRect(cx-bw/2,cy+8,bw,4);X.fillStyle='#ff3b5c';X.fillRect(cx-bw/2,cy+8,bw*hpPct,4);}else{X.fillStyle='rgba(0,0,0,.6)';X.fillRect(cx-bw/2,cy+4,bw,4);X.fillStyle='#ff3b5c';X.fillRect(cx-bw/2,cy+4,bw*hpPct,4);}
X.globalAlpha=1;X.textAlign='left';}}}
function drawDarkOverlay(){if(G.fx.dark<=0)return;const a=Math.min(0.75,G.fx.dark/7),px=P.x-G.camX+6,py=P.y+8,radius=95+Math.sin(G.t*2)*8,grd=X.createRadialGradient(px,py,radius*0.4,px,py,radius*1.6);grd.addColorStop(0,'rgba(0,0,10,0)');grd.addColorStop(0.5,'rgba(5,0,20,'+(a*0.55)+')');grd.addColorStop(1,'rgba(0,0,8,'+(a*0.92)+')');X.fillStyle=grd;X.fillRect(0,0,W,H);}
function render(){X.setTransform(1,0,0,1,0,0);X.textBaseline='top';let sx=0,sy=0;if(G.shake>0){sx=rnd(-G.shake,G.shake)*0.5;sy=rnd(-G.shake,G.shake)*0.5;}X.save();X.translate(Math.round(sx),Math.round(sy));drawBg();if(LV){drawEventFX();drawWeather();drawWorld();for(const e of LV.ens)if(!e.dead)drawEnemy(e);drawPlayer();drawBullets();drawPT();if(G.bossDeathFX>0){const t=1-G.bossDeathFX/1.5,px=G.bossDeathX-G.camX,py=G.bossDeathY,cols=G.bossDeathColors||['#ffe14a','#ff8a3c','#ff3b5c'];X.save();X.globalCompositeOperation='lighter';for(let i=0;i<4;i++){X.globalAlpha=Math.max(0,(1-t)*(0.65-i*0.13));X.strokeStyle=cols[i%cols.length];X.lineWidth=3-t*2;const r=t*(180+i*70);X.beginPath();X.arc(px,py,r,0,6.283);X.stroke();}const grd=X.createRadialGradient(px,py,0,px,py,120*t+1);grd.addColorStop(0,'rgba(255,240,160,'+(1-t)*0.65+')');grd.addColorStop(0.5,'rgba(255,120,50,'+(1-t)*0.3+')');grd.addColorStop(1,'rgba(255,50,20,0)');X.globalAlpha=1;X.fillStyle=grd;X.beginPath();X.arc(px,py,120*t+1,0,6.283);X.fill();X.restore();}drawDarkOverlay();
if(G.state==='teleporting'){const t=1-G.teleportT/0.8;X.strokeStyle='rgba(127,224,255,'+(1-t)+')';X.lineWidth=4*(1-t)+1;for(let i=0;i<5;i++){const r=t*220+i*35;X.beginPath();X.arc(P.x-G.camX+6,P.y+8,r,0,6.283);X.stroke();}X.fillStyle='rgba(240,250,255,'+(t*0.7)+')';X.fillRect(0,0,W,H);}
drawHud();}
const vg=X.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.35)');X.fillStyle=vg;X.fillRect(0,0,W,H);X.restore();}
let last=0;const _tbBtns=Array.from(document.querySelectorAll('.tb'));
function _anyTBOn(){for(const b of _tbBtns){if(b.classList.contains('on'))return true;}return false;}
let _pauseIdleT=0,_pauseShown=false;const _PAUSE_GRACE=1.5;
function updatePauseBtn(){const b=document.getElementById('btnPause');if(!b)return;if(!(IS_TOUCH&&G.state==='play')){_pauseIdleT=0;if(_pauseShown){b.classList.remove('show');_pauseShown=false;}return;}if(_anyTBOn()){_pauseIdleT=0;if(_pauseShown){b.classList.remove('show');_pauseShown=false;}return;}_pauseIdleT+=1/60;if(_pauseIdleT>=_PAUSE_GRACE&&!_pauseShown){b.classList.add('show');_pauseShown=true;}}
function loop(ts){requestAnimationFrame(loop);if(!last)last=ts;let dtReal=(ts-last)/1000;last=ts;if(dtReal>0.05)dtReal=0.05;let dt=dtReal;if(G.slowmo>0){G.slowmo=Math.max(0,G.slowmo-dtReal);dt*=0.25;}if(G.bossDeathFX>0)G.bossDeathFX=Math.max(0,G.bossDeathFX-dtReal);if(G.state==='play'||G.state==='bossDefeat'||G.state==='teleporting')update(dt);else G.t+=dt;updatePauseBtn();render();}
document.fonts.ready.then(()=>{render();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')togglePause();});
window.addEventListener('blur',()=>{if(G.state==='play')togglePause();});
const MBG=document.getElementById('menuBg'),MBX=MBG.getContext('2d');let mbMet=[],mbStar=[],mbLast=0,mbOn=false,mbResizeT=0;
function mbResize(){const r=document.getElementById('app').getBoundingClientRect();MBG.width=Math.max(320,r.width||innerWidth);MBG.height=Math.max(240,r.height||innerHeight);mbStar=[];for(let i=0;i<60;i++)mbStar.push({x:Math.random()*MBG.width,y:Math.random()*MBG.height*0.7,s:Math.random()<0.2?2:1,tw:Math.random()*6.28});}
addEventListener('resize',()=>{if(mbOn){clearTimeout(mbResizeT);mbResizeT=setTimeout(mbResize,120);}});
let mbGiantT=0;function mbSpawn(dt){const w=MBG.width,h=MBG.height;mbGiantT-=dt;if(mbMet.length<6&&Math.random()<0.06){mbMet.push({x:Math.random()*w*0.9-w*0.1,y:-20,vx:(Math.random()-0.5)*80+40,vy:180+Math.random()*180,size:2+Math.random()*3,trail:[]});}if(Math.random()<0.02&&mbMet.length<8){mbMet.push({x:Math.random()*w*0.9-w*0.1,y:-20,vx:(Math.random()-0.5)*50-30,vy:220+Math.random()*160,size:1.5+Math.random()*2,trail:[]});}if(mbGiantT<=0){mbGiantT=15+Math.random()*10;mbMet.push({x:Math.random()*w*0.8-w*0.2,y:-50,vx:rnd(-40,40),vy:rnd(250,350),size:8+Math.random()*6,trail:[],giant:true});}}
function mbDraw(dt){if(!mbOn)return;const w=MBG.width,h=MBG.height;MBX.clearRect(0,0,w,h);const g=MBX.createLinearGradient(0,0,0,h);g.addColorStop(0,'#050a18');g.addColorStop(0.55,'#08142a');g.addColorStop(1,'#04050a');MBX.fillStyle=g;MBX.fillRect(0,0,w,h);for(const s of mbStar){s.tw+=dt*2;const a=0.3+0.5*(Math.sin(s.tw)*0.5+0.5);MBX.fillStyle='rgba(180,220,255,'+a+')';MBX.fillRect(s.x,s.y,s.s,s.s);}mbSpawn(dt);for(let i=mbMet.length-1;i>=0;i--){const m=mbMet[i];m.trail.push({x:m.x,y:m.y});if(m.trail.length>(m.giant?20:10))m.trail.shift();m.x+=m.vx*dt;m.y+=m.vy*dt;MBX.save();MBX.globalCompositeOperation='lighter';for(let j=0;j<m.trail.length;j++){const t=m.trail[j],k=j/m.trail.length;if(m.giant){const grd=MBX.createRadialGradient(t.x,t.y,0,t.x,t.y,m.size*(1-k*0.8));grd.addColorStop(0,'rgba(255,240,160,'+(k*0.8)+')');grd.addColorStop(0.5,'rgba(255,120,20,'+(k*0.5)+')');grd.addColorStop(1,'rgba(255,40,10,0)');MBX.fillStyle=grd;MBX.beginPath();MBX.arc(t.x,t.y,m.size*(1.5-k*1.2),0,6.283);MBX.fill();}else{MBX.fillStyle='rgba(255,'+Math.round(100+80*k)+',40,'+(k*0.55)+')';MBX.beginPath();MBX.arc(t.x,t.y,m.size*(0.3+k*0.9),0,6.283);MBX.fill();}}const headG=MBX.createRadialGradient(m.x,m.y,0,m.x,m.y,m.size*(m.giant?12:7));headG.addColorStop(0,'rgba(255,240,160,1)');headG.addColorStop(0.2,'rgba(255,200,60,1)');headG.addColorStop(0.5,'rgba(255,100,20,.8)');headG.addColorStop(1,'rgba(255,20,0,0)');MBX.fillStyle=headG;MBX.beginPath();MBX.arc(m.x,m.y,m.size*(m.giant?12:7),0,6.283);MBX.fill();MBX.fillStyle='#fff2a0';MBX.beginPath();MBX.arc(m.x,m.y,m.size*(m.giant?0.8:0.5),0,6.283);MBX.fill();MBX.restore();if(m.y>h+60||m.x<-80||m.x>w+80)mbMet.splice(i,1);}MBX.fillStyle='rgba(4,5,10,.15)';MBX.fillRect(0,0,w,h);}
function mbLoop(ts){requestAnimationFrame(mbLoop);if(!mbOn)return;if(!mbLast)mbLast=ts;let dt=(ts-mbLast)/1000;mbLast=ts;if(dt>0.05)dt=0.05;mbDraw(dt);}
function setMenuBg(on){mbOn=on;if(on){mbResize();MBG.classList.add('on');}else MBG.classList.remove('on');}
menu();requestAnimationFrame(loop);requestAnimationFrame(mbLoop);
