function upPlayer(dt){if(P.dead){P.deadT+=dt;if(P.deadT>1.15){if(G.lives<0)showOver();else respawn();}return;}P.invuln=Math.max(0,P.invuln-dt);P.stun=Math.max(0,P.stun-dt);P.coyote=Math.max(0,P.coyote-dt);P.shootCd-=dt;P.recoil=Math.max(0,P.recoil-dt*6);P.blinkT+=dt;if(P.wT>0){P.wT-=dt;if(P.wT<=0)P.weapon='normal';}if(P.rapidT>0)P.rapidT-=dt;if(P.speedT>0)P.speedT-=dt;if(P.shield>0)P.shield-=dt;if(P.onGround){P.jumps=0;P.coyote=0.1;}let ax=0;if(P.stun<=0){if(inp.left)ax-=1;if(inp.right)ax+=1;}P.vx=ax*(P.speedT>0?SPD*1.6:SPD);if(ax)P.face=ax;P.anim+=Math.abs(P.vx)*dt*0.09;if(inp.jump&&!P.prevJump){if(P.onGround||P.coyote>0){P.vy=-320;P.coyote=0;P.jumps=1;sfx('jump');burst(P.x+6,P.y+P.h,4,'#8fb4dd');}else if(P.jumps<2){P.vy=-276;P.jumps=2;sfx('jump');burst(P.x+6,P.y+P.h,6,'#7fe0ff');}}P.prevJump=inp.jump;if(!inp.jump&&P.vy<-150)P.vy=-150;resolveX(P,dt);phys(P,dt);if(P.y>H+50){die();return;}if(P.shootCd<=0&&inp.shoot){const rate=(P.rapidT>0?0.10:0.17)*(P.weapon==='spread'?1.35:1);P.shootCd=rate;P.recoil=1;const bx=P.x+P.w/2+P.face*8,by=P.y+7;const s=440;sfx('shoot');if(P.weapon==='spread'){for(const a of[-0.22,0,0.22])bullets.push(mkBullet(bx,by,Math.cos(a)*s*P.face,Math.sin(a)*s,1,'#ffe14a'));}else if(P.weapon==='laser'){bullets.push(mkBullet(bx,by,s*1.7*P.face,0,2,'#7ff0ff',true));}else{bullets.push(mkBullet(bx,by,s*P.face,0,1,'#ffe14a'));}burst(bx,by,2,'#fff2a8');}const ch=Math.floor(P.x/128);if(ch!==G.chunk){G.chunk=ch;if(Math.random()<0.085*DIFFDATA().spawn)triggerEffect();}}

drawWeapon(x,y,bob,f);
if(P.shootCd>0.12){const mx=x+(f>0?12:-2),my=y+7+bob;const flash=X.createRadialGradient(mx,my,0,mx,my,8);flash.addColorStop(0,'rgba(255,255,200,1)');flash.addColorStop(0.4,'rgba(255,225,74,.8)');flash.addColorStop(1,'rgba(255,200,74,0)');X.fillStyle=flash;X.fillRect(mx-8,my-8,16,16);}}
function drawWeapon(x,y,bob,f){const wx=x+(f>0?11:-3),wy=y+7+bob;if(P.weapon==='spread'){X.fillStyle='#c89040';X.fillRect(wx,wy,4,3);X.fillStyle='#8a5a10';X.fillRect(wx+(f>0?3:-2),wy,2,3);X.fillStyle='rgba(255,225,74,.5)';X.fillRect(wx,wy,4,1);}else if(P.weapon==='laser'){X.fillStyle='#7ff0ff';X.fillRect(wx,wy,7,2);X.fillStyle='rgba(180,255,255,.7)';X.fillRect(wx,wy,7,1);const lg=X.createRadialGradient(wx+3,wy+1,0,wx+3,wy+1,5);lg.addColorStop(0,'rgba(127,240,255,.6)');lg.addColorStop(1,'rgba(127,240,255,0)');X.fillStyle=lg;X.fillRect(wx-3,wy-3,13,8);}else{X.fillStyle='#b8c6dd';X.fillRect(wx,wy,3,2);X.fillStyle='rgba(255,255,255,.5)';X.fillRect(wx,wy,3,1);}}
function drawEnemy(e){const x=Math.round(e.x-G.camX),y=Math.round(e.y);if(x>W+50||x+e.w<-50)return;const fl=e.hitT>0;
if(e.type==='boss'||fl){const gcol=fl?'rgba(255,255,255,.5)':e.type==='boss'?'rgba(255,60,90,.28)':'rgba(255,100,60,.15)';const grd=X.createRadialGradient(x+e.w/2,y+e.h/2,4,x+e.w/2,y+e.h/2,e.w*1.2);grd.addColorStop(0,gcol);grd.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=grd;X.fillRect(x-e.w/2,y-e.h/2,e.w*2,e.h*2);}
if(e.type==='walk'){X.fillStyle=fl?'#fff':'#c0392b';X.fillRect(x,y+3,14,11);X.fillStyle=fl?'#fff':'#e74c3c';X.fillRect(x+1,y+1,12,4);X.fillStyle='rgba(0,0,0,.25)';X.fillRect(x+11,y+7,3,7);X.fillStyle='#111';X.fillRect(x+3,y+6,3,3);X.fillRect(x+8,y+6,3,3);X.fillStyle=fl?'#fff':'#7a2418';X.fillRect(x+1,y+13,4,2);X.fillRect(x+9,y+13,4,2);}
else if(e.type==='shoot'){X.fillStyle=fl?'#fff':'#8e44ad';X.fillRect(x+1,y+4,12,10);X.fillStyle=fl?'#fff':'#b06fd0';X.fillRect(x+2,y,10,5);X.fillStyle='rgba(0,0,0,.25)';X.fillRect(x+10,y+6,3,8);X.fillStyle='#111';X.fillRect(x+(e.face>0?8:3),y+2,3,2);X.fillStyle='#d0d6e0';X.fillRect(x+(e.face>0?13:-2),y+7,3,2);}
else if(e.type==='jump'){X.fillStyle=fl?'#fff':'#27ae60';X.beginPath();X.arc(x+7,y+7,7,0,6.283);X.fill();X.fillStyle='rgba(0,0,0,.25)';X.beginPath();X.arc(x+9,y+9,4,0,6.283);X.fill();X.fillStyle='#111';X.fillRect(x+4,y+5,2,3);X.fillRect(x+9,y+5,2,3);X.fillStyle=fl?'#fff':'#145a32';X.fillRect(x+2,y+12,10,2);}
else if(e.type==='fly'){const w=Math.sin(e.t*10)*3;X.fillStyle=fl?'#fff':'#e67e22';X.beginPath();X.arc(x+7,y+6,6,0,6.283);X.fill();X.fillStyle=fl?'#fff':'#c0392b';X.fillRect(x-4,y+3+w,5,3);X.fillRect(x+9,y+3-w,5,3);X.fillStyle='#fff';X.fillRect(x+4,y+4,5,4);X.fillStyle='#111';X.fillRect(x+5,y+5,2,2);}
else if(e.type==='turret'){X.fillStyle=fl?'#fff':'#5d6d7e';X.fillRect(x,y+6,16,10);X.fillStyle=fl?'#fff':'#8391a1';X.beginPath();X.arc(x+8,y+8,7,Math.PI,0);X.fill();X.fillStyle='rgba(0,0,0,.3)';X.fillRect(x+11,y+8,5,8);X.fillStyle='#e74c3c';X.fillRect(x+6,y+3,4,4);X.fillStyle='#2c3e50';X.fillRect(x+7,y+10,2,6);}
else if(e.type==='boss'){const hb=Math.max(0,e.hp/e.maxHp);const bt=e.bossType||'brute';const col1=bt==='flyer'?'#5a2a6e':bt==='shooter'?'#2e1a3e':'#3b1a2e';const col2=bt==='flyer'?'#8a4aa8':bt==='shooter'?'#5a2a8e':'#6b2044';X.fillStyle=fl?'#fff':col1;X.fillRect(x,y+6,44,38);X.fillStyle=fl?'#fff':col2;X.fillRect(x+3,y,38,12);X.fillStyle='rgba(0,0,0,.3)';X.fillRect(x+38,y+18,6,26);X.fillStyle='#ff3b5c';X.fillRect(x+8,y+14,10,8);X.fillRect(x+26,y+14,10,8);X.fillStyle='#ffe14a';X.fillRect(x+10,y+16,6,4);X.fillRect(x+28,y+16,6,4);X.fillStyle='#2c3e50';X.fillRect(x+14,y+28,16,10);X.fillStyle='#e74c3c';X.fillRect(x+16,y+30,12,3);X.fillStyle='#111';X.fillRect(x+2,y+40,10,4);X.fillRect(x+32,y+40,10,4);X.fillStyle='#1a0a14';X.fillRect(x,y-8,44,5);X.fillStyle='#ff3b5c';X.fillRect(x,y-8,44*hb,5);}}
function drawBullets(){for(const b of bullets){const bx=Math.round(b.x-G.camX),by=Math.round(b.y);X.fillStyle=b.friendly?'rgba(255,225,74,.4)':'rgba(255,90,60,.4)';X.fillRect(bx-(b.vx>0?4:-2),by+1,4,2);const col=b.friendly?(b.color||'#ffe14a'):'#ff5a3c';const grd=X.createRadialGradient(bx+2,by+2,0,bx+2,by+2,5);grd.addColorStop(0,'#fff');grd.addColorStop(0.5,col);grd.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=grd;X.beginPath();X.arc(bx+2,by+2,5,0,6.283);X.fill();X.fillStyle='#fff';X.fillRect(bx+1,by+1,2,2);}
for(const m of MT){const mx=Math.round(m.x-G.camX),my=Math.round(m.y);const grd=X.createRadialGradient(mx,my,0,mx,my,9);grd.addColorStop(0,'#ffe14a');grd.addColorStop(0.4,'#ff8a3c');grd.addColorStop(1,'rgba(255,120,60,0)');X.fillStyle=grd;X.beginPath();X.arc(mx,my,9,0,6.283);X.fill();X.fillStyle='#ffe14a';X.beginPath();X.arc(mx,my,2.5,0,6.283);X.fill();}}
function heart(x,y,on){X.fillStyle=on?'#ff3b5c':'#2a1620';X.fillRect(x+1,y,2,1);X.fillRect(x+4,y,2,1);X.fillRect(x,y+1,7,2);X.fillRect(x+1,y+3,5,1);X.fillRect(x+2,y+4,3,1);X.fillRect(x+3,y+5,1,1);}
function drawHud(){X.textBaseline='top';X.font='bold 13px monospace';for(let i=0;i<P.maxHp;i++)heart(8+i*9,8,i<P.hp);X.fillStyle='#9fd6ff';X.fillText('x'+Math.max(0,G.lives),10+P.maxHp*9,8);X.textAlign='right';X.fillStyle='#ffe14a';X.fillText('PTS '+G.score,W-8,8);X.fillStyle='#7fe0ff';X.fillText(CFG.name.toUpperCase().slice(0,8),W-8,24);X.fillStyle='#a97bff';X.fillText('NIV '+G.level+' · '+CFG.difficulty.toUpperCase().slice(0,4),W-8,40);X.textAlign='center';X.fillStyle='rgba(180,220,255,.7)';X.fillText(curBiome().name,W/2,H-26);X.textAlign='left';const wn=P.weapon==='spread'?'TRIPLE':P.weapon==='laser'?'LÁSER':'NORMAL';X.fillStyle='#8fb4dd';X.fillText(wn+(P.rapidT>0?' +RAPID':''),8,H-16);if(P.shield>0){X.fillStyle='#7fe0ff';X.fillText('ESCUDO '+Math.ceil(P.shield),8,H-32);}
if(G.fx.dark>0){const g=X.createRadialGradient(P.x-G.camX,P.y+8,26,P.x-G.camX,P.y+8,150);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,6,.94)');X.fillStyle=g;X.fillRect(0,0,W,H);}
if(G.flashT>0){X.globalAlpha=Math.min(0.45,G.flashT*1.5);X.fillStyle=G.flashColor;X.fillRect(0,0,W,H);X.globalAlpha=1;}
if(G.msgT>0){X.textAlign='center';X.font='bold 14px monospace';X.globalAlpha=Math.min(1,G.msgT);const tw=X.measureText(G.msg).width;X.fillStyle='rgba(0,0,0,.78)';X.fillRect(W/2-tw/2-10,6,tw+20,20);X.strokeStyle=G.msgC;X.lineWidth=1;X.strokeRect(W/2-tw/2-10.5,6.5,tw+21,19);X.fillStyle=G.msgC;X.fillText(G.msg,W/2,10);X.globalAlpha=1;X.textAlign='left';X.textBaseline='top';}
const boss=LV.boss;if(boss&&!boss.dead&&boss.x<G.camX+W+60){const bw=180,bx=(W-bw)/2;X.fillStyle='rgba(0,0,0,.7)';X.fillRect(bx,H-20,bw,7);X.fillStyle='#ff3b5c';X.fillRect(bx+1,H-19,(bw-2)*Math.max(0,boss.hp/boss.maxHp),5);X.fillStyle='#ff9fb0';X.font='bold 13px monospace';X.textAlign='center';X.fillText('JEFE',W/2,H-36);X.textAlign='left';}}
function render(){X.setTransform(1,0,0,1,0,0);X.textBaseline='top';let sx=0,sy=0;if(G.shake>0){sx=rnd(-G.shake,G.shake)*0.5;sy=rnd(-G.shake,G.shake)*0.5;}X.save();X.translate(Math.round(sx),Math.round(sy));drawBg();if(LV){drawWeather();drawWorld();for(const e of LV.ens)if(!e.dead)drawEnemy(e);drawPlayer();drawBullets();drawPT();drawHud();}X.restore();}
let last=0;
function loop(ts){requestAnimationFrame(loop);if(!last)last=ts;let dt=(ts-last)/1000;last=ts;if(dt>0.05)dt=0.05;if(G.state==='play')update(dt);else G.t+=dt;render();}
menu();
requestAnimationFrame(loop);
</script>
